<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lav nøgler til notifikationer</title>
<style>
:root{--bg:#F1F3EE;--card:#fff;--fg:#15211B;--mut:#5A6B62;--acc:#1B5E43;--line:#D9DFD8;--field:#F6F8F4}
@media (prefers-color-scheme:dark){:root{--bg:#0F1612;--card:#17211B;--fg:#E9F0EB;--mut:#9DB0A5;--acc:#5BC594;--line:#2A3A31;--field:#1C2822}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto}h1{font-size:22px;margin:0 0 6px}p{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--fg);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:none;word-break:break-all}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 16px;background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0F1612}}
button.s{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:8px 12px;margin-top:8px;font-size:14px}
.warn{font-size:14px;color:var(--mut)}
</style></head><body><main>
<h1>Nøgler til notifikationer</h1>
<p>Tryk på knappen. Nøglerne laves på din egen enhed og sendes ingen steder hen.</p>
<div class="card"><button id="go" type="button">Lav nøgler</button></div>
<div id="out" hidden>
 <div class="card"><label for="pub">Offentlig nøgle</label><textarea id="pub" readonly></textarea><button class="s" type="button" data-c="pub">Kopiér</button><p class="warn" style="margin:10px 0 0">Indsættes i filen <b>config.js</b> ved <b>vapidPublicKey</b>.</p></div>
 <div class="card"><label for="prv">Privat nøgle (hemmelig)</label><textarea id="prv" readonly></textarea><button class="s" type="button" data-c="prv">Kopiér</button><p class="warn" style="margin:10px 0 0">Gemmes kun som GitHub-hemmelighed med navnet <b>VAPID_PRIVATE_KEY</b>. Del den aldrig, og læg den ikke i filerne.</p></div>
</div>
<script>
function b64u(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function fromU(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
document.getElementById('go').onclick=function(){
  crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']).then(function(k){return crypto.subtle.exportKey('jwk',k.privateKey)}).then(function(j){
    var x=fromU(j.x),y=fromU(j.y),raw=new Uint8Array(65);raw[0]=4;raw.set(x,1);raw.set(y,33);
    document.getElementById('pub').value=b64u(raw);document.getElementById('prv').value=j.d;document.getElementById('out').hidden=false;
  }).catch(function(e){alert('Din browser kunne ikke lave nøglerne: '+e.message)});
};
document.addEventListener('click',function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-c');if(!id)return;var t=document.getElementById(id);t.select();try{navigator.clipboard.writeText(t.value);e.target.textContent='Kopieret'}catch(x){document.execCommand('copy');e.target.textContent='Kopieret'}});
</script></main></body></html>
