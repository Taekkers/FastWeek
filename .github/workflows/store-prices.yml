name: Normalpriser pr. butik
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, update]
        default: probe
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/store-prices.js
        env:
          MODE: ${{ inputs.mode }}
