name: Normalpriser pr. butik
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-prices
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/store-prices.js
        env:
          PREJ_API_KEY: ${{ secrets.PREJ_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
