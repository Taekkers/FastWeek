<!doctype html>
<html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FastWeek</title>
<meta name="description" content="Ugens madplan, lager og indkøbsliste med tilbud">
<meta name="theme-color" content="#1B5E43">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FastWeek"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a calm, image-led weekly planner. Floating tab bar, soft cards with drawn plates, bottom sheets with a two-step guide. Pine for actions, tilbud-red only for prices, amber for the weekend. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface2:#F6F8F3; --ink:#15231C; --ink2:#566860; --line:#DDE3DB;
  --pine:#1B5E43; --pine-ink:#FFFFFF; --pine-soft:#E0EDE4; --pine-deep:#123F2E;
  --offer:#C4212C; --offer-soft:#FCE6E7;
  --weekend:#8A5A0B; --weekend-soft:#F8EDD6;
  --warn:#9A5400; --scrim:rgba(14,22,18,.5);
  --sh:0 1px 2px rgba(18,40,30,.06),0 12px 28px -16px rgba(18,40,30,.24);
  --sh-up:0 -10px 40px -12px rgba(18,40,30,.28);
  --glass:rgba(255,255,255,.82);
  --f-display:'Titillium Web',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-body:'Titillium Web',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17211C; --surface2:#1B2721; --ink:#E9EFEB; --ink2:#9CADA4; --line:#2A3830;
  --pine:#5CC08F; --pine-ink:#08170E; --pine-soft:#1C3629; --pine-deep:#8BD9B2;
  --offer:#FF7A82; --offer-soft:#3A1B1E;
  --weekend:#E8B95F; --weekend-soft:#2E2818;
  --warn:#F0A94B; --scrim:rgba(0,0,0,.62);
  --sh:0 1px 2px rgba(0,0,0,.45),0 12px 28px -16px rgba(0,0,0,.7);
  --sh-up:0 -10px 40px -12px rgba(0,0,0,.7);
  --glass:rgba(23,33,28,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211C; --surface2:#1B2721; --ink:#E9EFEB; --ink2:#9CADA4; --line:#2A3830;
  --pine:#5CC08F; --pine-ink:#08170E; --pine-soft:#1C3629; --pine-deep:#8BD9B2;
  --offer:#FF7A82; --offer-soft:#3A1B1E;
  --weekend:#E8B95F; --weekend-soft:#2E2818;
  --warn:#F0A94B; --scrim:rgba(0,0,0,.62);
  --sh:0 1px 2px rgba(0,0,0,.45),0 12px 28px -16px rgba(0,0,0,.7);
  --sh-up:0 -10px 40px -12px rgba(0,0,0,.7);
  --glass:rgba(23,33,28,.82); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(40px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
h2{font:700 18px/1.25 var(--f-display);text-wrap:balance}
.lbl{font:600 11.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.sm{font-size:13px}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{font:900 22px/1 var(--f-display);letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--pine)}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;box-shadow:var(--sh)}
.icon-btn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* floating tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.tabs-in{pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh-up);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border:0;background:none;color:var(--ink2);font:600 11.5px var(--f-body);border-radius:18px;transition:background .2s,color .2s}
.tab[aria-current="page"]{color:var(--pine);background:var(--pine-soft)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--pine);background:var(--pine);color:var(--pine-ink);font-weight:700;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--pine)}
.btn.danger{background:transparent;border-color:var(--offer);color:var(--offer)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.x{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--ink2);font-size:24px;line-height:1;display:grid;place-items:center;padding:0}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11.5px var(--f-body);padding:3px 9px;border-radius:999px;background:var(--pine-soft);color:var(--pine);white-space:nowrap}
.chip.wk{background:var(--weekend-soft);color:var(--weekend)}
.chip.off{background:var(--offer-soft);color:var(--offer)}
.chip.warn{background:var(--weekend-soft);color:var(--warn)}
.chip.ex{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.was{font:400 12px var(--f-mono);color:var(--ink2);text-decoration:line-through}

/* sections */
#view{max-width:640px;margin:0 auto;padding-block:8px 0;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}

/* week header */
.wnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px}
.wnav .x{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;font-size:24px;background:var(--surface)}
.wnav div.c{text-align:center}
.wt{font:900 28px/1.05 var(--f-display);letter-spacing:-.02em}
.wr{font-size:13px;color:var(--ink2);margin-top:2px}
.wishes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wishes .chip{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.wishes .chip.on{background:var(--pine-soft);border-color:transparent;color:var(--pine)}
.edit-w{border:0;background:none;color:var(--pine);font-weight:700;font-size:13.5px;padding:6px 4px}

/* hero (no plan yet) */
.hero{padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden;position:relative}
.hero .fan{display:flex;justify-content:center;height:96px;margin-bottom:2px}
.hero .fan .art{width:96px;height:96px;border-radius:50%;box-shadow:var(--sh);border:3px solid var(--surface)}
.hero .fan .art:nth-child(1){transform:translateX(18px) rotate(-6deg);z-index:1}
.hero .fan .art:nth-child(2){transform:translateY(-6px);z-index:3}
.hero .fan .art:nth-child(3){transform:translateX(-18px) rotate(6deg);z-index:2}
.hero h2{font-size:22px;letter-spacing:-.01em}
.hero p{color:var(--ink2);max-width:44ch}
.hero .alt{border:0;background:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;padding:4px 0;align-self:flex-start}

/* day cards */
.days{display:flex;flex-direction:column;gap:10px}
.dc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;padding:10px 10px 10px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .15s,opacity .2s}
.dc.wk{background:linear-gradient(180deg,var(--weekend-soft),var(--surface) 70%)}
.dc.today{border-color:var(--pine);box-shadow:0 0 0 2px var(--pine-soft),var(--sh)}
.dc-main{min-width:0;border:0;background:none;text-align:left;padding:0;display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:center}
.dc:active{transform:scale(.995)}
.art{border-radius:16px;overflow:hidden;background:var(--line);display:block;flex:none;position:relative}
.art svg,.art img{display:block;width:100%;height:100%;object-fit:cover}
.dc .art{width:68px;height:68px}
.dc-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.dc-d{font:600 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;gap:8px;align-items:center}
.dc.today .dc-d{color:var(--pine)}
.dc.wk .dc-d{color:var(--weekend)}
.dc-n{font:700 17px/1.2 var(--f-display);overflow-wrap:break-word;hyphens:auto;text-wrap:balance}
.dc.done .dc-n{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1.5px}
.dc.done .art{opacity:.55}
.dc-m{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dc-a{display:flex;gap:2px;align-items:center}
.dc.lo{background:var(--surface2);border-style:dashed;box-shadow:none}
.dc.lo .art{opacity:.6}
.dc.lo .art::after{content:"↻";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#fff;background:rgba(16,34,26,.38)}
.dc.none{box-shadow:none;background:transparent;border-style:dashed}
.dc.none .art{background:transparent;display:grid;place-items:center;color:var(--ink2);border:1.5px dashed var(--line)}
.dc.none .art svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.ck{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s,transform .2s}
.ck svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ck.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.ol{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);text-decoration:none;flex:none}
.ol svg,.srcl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ol:hover,.srcl:hover{color:var(--pine)}
.srcl{display:inline-flex;align-items:center;gap:8px;color:var(--pine);font-weight:600;font-size:14.5px;text-decoration:none;padding:6px 0}
.srcl span{text-decoration:underline;text-underline-offset:3px}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.foot .btn{flex:1 1 auto}

/* shopping */
.stores{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(108px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:12px 2px 6px;margin:-12px 0 -6px;scrollbar-width:none}
.stores::-webkit-scrollbar{display:none}
.sto{scroll-snap-align:start}
.sto{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 12px 12px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--sh);transition:border-color .2s,background .2s,transform .12s;min-width:0}
.sto:active{transform:scale(.985)}
.sto[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft)}
.sto b{font:700 13px var(--f-display);color:var(--ink2);white-space:nowrap}
.sto .tot{font:600 21px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sto .tot small{font:500 12px var(--f-mono);color:var(--ink2);margin-left:2px}
.sto .sv{font-size:12px;color:var(--ink2)}
.sto .best{position:absolute;top:-9px;left:12px;background:var(--pine);color:var(--pine-ink);font:700 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.sto .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.sto .bar i{display:block;height:100%;background:var(--pine);border-radius:4px}
.reco{padding:16px;display:flex;flex-direction:column;gap:12px}
.reco .big{font:900 20px/1.2 var(--f-display);letter-spacing:-.01em}
.reco .big em{font-style:normal;color:var(--pine)}
.fine{font-size:12.5px;color:var(--ink2)}
.group{display:flex;flex-direction:column;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.it:last-child{border-bottom:0}
.it input{width:22px;height:22px;margin:0;accent-color:var(--pine)}
.it-n{font-weight:600;overflow-wrap:anywhere}
.it.on .it-n{text-decoration:line-through;color:var(--ink2)}
.it-m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--ink2);align-items:center}
.it-p{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.it-p .pr{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.it-p .pr.off{color:var(--offer)}
.it-x{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}

/* stock + recipe lists */
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600;overflow-wrap:anywhere;display:block}
.li .sub{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.li .qt{font:500 14px var(--f-mono);text-align:right}
.li.rec{grid-template-columns:48px minmax(0,1fr) auto;padding:10px 14px}
.li.rec .art{width:48px;height:48px;border-radius:13px}
.list{border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.stat{display:flex;flex-wrap:wrap;gap:6px}

/* forms + sheet */
input[type=text],input[type=password],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
input[type=checkbox]{accent-color:var(--pine)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;min-height:36px}
.chk input{width:20px;height:20px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 76px 66px 36px;gap:6px;align-items:center}
.ing input,.ing select{padding:8px 6px}
#sheet .scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:600px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;border:1px solid var(--line);box-shadow:var(--sh-up);
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sh-grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sh-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 0 10px;z-index:1}
.sh-body{display:flex;flex-direction:column;gap:14px}
.photo{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.photo input[type=file]{min-height:0;border:0;padding:0;background:none;font-size:14px}
.hero-img{border-radius:20px;overflow:hidden;aspect-ratio:16/10;position:relative;box-shadow:var(--sh)}
.hero-img .art{width:100%;height:100%;border-radius:0}
.hero-img .cam{position:absolute;right:10px;bottom:10px}
.cam{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--glass);color:var(--ink);font:600 13px var(--f-body);padding:9px 14px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cam svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kcal-line{display:flex;flex-wrap:wrap;gap:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--sh)}
.rv{display:grid;grid-template-columns:24px minmax(0,1fr) 78px 70px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}

/* segmented controls and toggles */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.seg button{min-height:42px;border:0;border-left:1px solid var(--line);background:none;font-weight:600;color:var(--ink2);transition:background .18s,color .18s}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pine-soft);color:var(--pine)}
.seg button[disabled]{opacity:.45;cursor:default}
.ingw{display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rl{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rl summary{padding:9px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.rl .rule{padding:4px 12px 12px}
.rule{display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--ink2)}
.lnk{background:none;border:0;color:var(--pine);font-weight:700;padding:4px 0;font-size:14px}

/* guide (ugens ønsker) */
.sheet.wiz{padding-bottom:0;display:flex;flex-direction:column;max-height:94dvh;overflow:hidden}
.wz-head{padding:12px 0 6px;display:flex;flex-direction:column;gap:10px}
.wz-top{display:flex;align-items:center;justify-content:space-between}
.wz-step{font:600 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.wz-bar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.wz-bar i{height:4px;border-radius:4px;background:var(--line);transition:background .3s}
.wz-bar i.on{background:var(--pine)}
.wz-body{overflow:auto;padding:12px 2px 18px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.wz-q{font:900 24px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.wz-s{color:var(--ink2);max-width:46ch}

/* Stores ordered by what the whole list costs there: cheapest first. */

  if(us.length)h+='<div class="sline"><span class="slbl">Bruger fra lageret</span>'+us.map(function(x){return '<span class="chip'+(x.urgent?'':' ex')+'">'+esc(x.name)+'</span>'}).join('')+'</div>';
  var lf=su.left.filter(function(x){return x.urgent}).slice(0,5);

function offerPlanHtml(w,P){

  var items=computeList(w);if(!items.length)return '';

    var key=it.k+'_'+it.unit,s=rec.assign?rec.assign[key]:rec.stores[0],ln=s&&sc.stores[s]&&sc.stores[s].lines[key];

      '<b>'+esc(s)+'</b><span class="tot">'+nf(Math.round(x.total),0)+'<small>kr</small></span>'+
      '<span class="sv">'+(x.n?x.n+' tilbud · −'+nf(Math.round(x.save),0)+' kr':'Ingen tilbud')+'</span>'+
      '<span class="bar"><i style="width:'+Math.max(8,Math.round(x.total/mx*100))+'%"></i></span></button>'}).join('');
  if(pair)h+='<button class="sto pair" data-act="pickstore" data-s="'+pair.sel+'" aria-pressed="'+(sel===pair.sel)+'"><span class="best">Nemmest</span><b>'+esc(pair.stores.join(' + '))+'</b><span class="tot">'+nf(Math.round(pair.total),0)+'<small>kr</small></span><span class="sv">−'+nf(Math.round(pair.save),0)+' kr mod én butik</span><span class="bar"><i style="width:'+Math.max(8,Math.round(pair.total/mx*100))+'%"></i></span></button>';
  return h+'</div>';
}

function rowsFromRes(res){

/* Careful guess of the main ingredient. Stock cubes and sauces do not count. Never guesses vegetarian: isVeg() reads the ingredients instead. */
function guessProt(rows){
  var t=(rows||[]).map(function(g){return String(g.n||'').toLowerCase()}).filter(function(n){return !/bouillon|fond|terning|krydderi|sauce|jus\b/.test(n)}).join(' | ');
  if(/okse|kalv|bøf|culotte|entrecote|roastbeef/.test(t))return 'okse';
  if(/kylling|kalkun|ande(?:bryst|lår|konfit)|(?:^|[^a-zæøå])and(?![a-zæøå])/.test(t))return 'kylling';
  if(/svin|flæsk|bacon|skinke|medister|pølse|frikadelle|nakke|kotelet/.test(t))return 'svin';
  if(/laks|torsk|fisk|rejer|(?:^|[^a-zæøå])tun(?![a-zæøå])|makrel|sild|rødspætte|(?:^|[^a-zæøå])sej(?![a-zæøå])|muslinger/.test(t))return 'fisk';

    im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);try{res(c.toDataURL('image/jpeg',q))}catch(e){rej(e)}};

function handlePhoto(file,id){

    S.recipes[id]=Object.assign({},S.recipes[id],{img:img});
    var el=$('#hero-box');if(el)el.innerHTML=heroHtml(id,S.recipes[id]);
    if(old&&old.id&&S.assets&&S.assets.delete)S.assets.delete(old.id).catch(function(){});
    phSt('ok','Foto gemt');toast('Foto gemt');draw();
  };
  var fail=function(e){console.error(e);phSt('bad','Kunne ikke gemme fotoet. Prøv et andet billede.')};
  var old=S.recipes[id].img;

    resizeImage(file,1400).then(function(b){return S.assets.upload(b)}).then(function(res){return up(udoc('recipes/'+id),{img:{id:res.id}}).then(function(){done({id:res.id},old)})}).catch(fail);

  }

  }).then(function(d){return up(udoc('recipes/'+id),{img:{data:d}}).then(function(){done({data:d},old)})}).catch(fail);
}

/* Sunday double portion -> Monday next week is leftovers (and the other way round) */
function syncCarry(w,days){
  var nw=weekId(addDays(monOfWeek(w),7)),np=S.plans[nw];if(!np||!np.days)return;
  var sun=days[6],want=sun&&sun.r&&sun.dbl&&!sun.off&&!sun.lo&&!sun.f?sun.r:'',nd=fillDays(np.days.map(function(x){return Object.assign({},x)})),cur=nd[0]||{},isCarry=!!(cur.lo&&cur.from===-1);
  if(want){
    if(cur.r&&!isCarry&&(cur.lock||cur.done||cur.f))return;
    if(isCarry&&cur.r===want)return;
    nd[0]={r:want,lo:true,from:-1,done:!!(isCarry&&cur.done),lock:false};
  }else if(isCarry){nd[0]={r:'',done:false,lock:false}}
  else return;
  return udoc('plans/'+nw).set({week:nw,start:monOfWeek(nw),days:nd,gen:np.gen||Date.now()});
}

  var ids=daysIds(days),B=weekBudget(),nfree=days.filter(function(d){return d&&!d.r&&!d.off&&!d.f&&!d.lo}).length;
  if(GEN_WHY==='few'&&nfree)S.planNote='Kun '+(7-nfree)+' retter passer til dine valg. Tilføj flere retter.';
  else if(B>0){var est=planEst(ids);if(est>B*1.05)S.planNote='Ca. '+kr(Math.round(est-B))+' over dit budget.'}
  var su0=stockUse(ids,ctxFor(w).exp),un=su0.used.filter(function(x){return x.urgent});
  if(un.length)S.planNote=(S.planNote?S.planNote+' ':'')+'Bruger '+un.slice(0,3).map(function(x){return x.name.toLowerCase()}).join(', ')+' fra lageret.';
  var P=getPrefs(w),offM=P.mode==='offers'&&activeOffers(w).length>0;
  return save(function(){
    return savePlanDays(w,days).then(function(){
      var L=S.lists[w]||{};
      if(S.settings.candy&&!P.low&&!L.slik)return up(udoc('lists/'+w),{extra:(L.extra||[]).concat([{id:'slik',name:'Weekendslik'}]),slik:true});
    }).then(function(){if(!quiet)toast((offM?'Madplan lavet efter ugens tilbud':'Madplan lavet ud fra dit lager')+(S.planNote?'. '+S.planNote:''));return true});
  });
}
