<!doctype html>
<html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FastWeek</title>
<meta name="description" content="Ugens madplan, lager og indkøbsliste med tilbud">
<meta name="theme-color" content="#1B5E43">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FastWeek"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a calm, image-led weekly planner. Floating tab bar, soft cards with drawn plates, bottom sheets with a two-step guide. Pine for actions, tilbud-red only for prices, amber for the weekend. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface2:#F6F8F3; --ink:#15231C; --ink2:#566860; --line:#DDE3DB;
  --pine:#1B5E43; --pine-ink:#FFFFFF; --pine-soft:#E0EDE4; --pine-deep:#123F2E;
  --offer:#C4212C; --offer-soft:#FCE6E7;
  --weekend:#8A5A0B; --weekend-soft:#F8EDD6;
  --warn:#9A5400; --scrim:rgba(14,22,18,.5);
  --sh:0 1px 2px rgba(18,40,30,.06),0 12px 28px -16px rgba(18,40,30,.24);
  --sh-up:0 -10px 40px -12px rgba(18,40,30,.28);
  --glass:rgba(255,255,255,.82);
  --f-display:'Schibsted Grotesk',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-body:'Schibsted Grotesk',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17211C; --surface2:#1B2721; --ink:#E9EFEB; --ink2:#9CADA4; --line:#2A3830;
  --pine:#5CC08F; --pine-ink:#08170E; --pine-soft:#1C3629; --pine-deep:#8BD9B2;
  --offer:#FF7A82; --offer-soft:#3A1B1E;
  --weekend:#E8B95F; --weekend-soft:#2E2818;
  --warn:#F0A94B; --scrim:rgba(0,0,0,.62);
  --sh:0 1px 2px rgba(0,0,0,.45),0 12px 28px -16px rgba(0,0,0,.7);
  --sh-up:0 -10px 40px -12px rgba(0,0,0,.7);
  --glass:rgba(23,33,28,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211C; --surface2:#1B2721; --ink:#E9EFEB; --ink2:#9CADA4; --line:#2A3830;
  --pine:#5CC08F; --pine-ink:#08170E; --pine-soft:#1C3629; --pine-deep:#8BD9B2;
  --offer:#FF7A82; --offer-soft:#3A1B1E;
  --weekend:#E8B95F; --weekend-soft:#2E2818;
  --warn:#F0A94B; --scrim:rgba(0,0,0,.62);
  --sh:0 1px 2px rgba(0,0,0,.45),0 12px 28px -16px rgba(0,0,0,.7);
  --sh-up:0 -10px 40px -12px rgba(0,0,0,.7);
  --glass:rgba(23,33,28,.82); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 128px;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
h2{font:700 18px/1.25 var(--f-display);text-wrap:balance}
.lbl{font:600 11.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.sm{font-size:13px}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--pine)}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;box-shadow:var(--sh)}
.icon-btn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* floating tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.tabs-in{pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh-up);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border:0;background:none;color:var(--ink2);font:600 11.5px var(--f-body);border-radius:18px;transition:background .2s,color .2s}
.tab[aria-current="page"]{color:var(--pine);background:var(--pine-soft)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--pine);background:var(--pine);color:var(--pine-ink);font-weight:700;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--pine)}
.btn.danger{background:transparent;border-color:var(--offer);color:var(--offer)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.x{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--ink2);font-size:24px;line-height:1;display:grid;place-items:center;padding:0}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11.5px var(--f-body);padding:3px 9px;border-radius:999px;background:var(--pine-soft);color:var(--pine);white-space:nowrap}
.chip.wk{background:var(--weekend-soft);color:var(--weekend)}
.chip.off{background:var(--offer-soft);color:var(--offer)}
.chip.warn{background:var(--weekend-soft);color:var(--warn)}
.chip.ex{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.was{font:400 12px var(--f-mono);color:var(--ink2);text-decoration:line-through}

/* sections */
#view{max-width:640px;margin:0 auto;padding-block:8px 0;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}

/* week header */
.wnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px}
.wnav .x{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;font-size:24px;background:var(--surface)}
.wnav div.c{text-align:center}
.wt{font:800 28px/1.05 var(--f-display);letter-spacing:-.02em}
.wr{font-size:13px;color:var(--ink2);margin-top:2px}
.wishes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wishes .chip{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.wishes .chip.on{background:var(--pine-soft);border-color:transparent;color:var(--pine)}
.edit-w{border:0;background:none;color:var(--pine);font-weight:700;font-size:13.5px;padding:6px 4px}

/* hero (no plan yet) */
.hero{padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden;position:relative}
.hero .fan{display:flex;justify-content:center;height:96px;margin-bottom:2px}
.hero .fan .art{width:96px;height:96px;border-radius:50%;box-shadow:var(--sh);border:3px solid var(--surface)}
.hero .fan .art:nth-child(1){transform:translateX(18px) rotate(-6deg);z-index:1}
.hero .fan .art:nth-child(2){transform:translateY(-6px);z-index:3}
.hero .fan .art:nth-child(3){transform:translateX(-18px) rotate(6deg);z-index:2}
.hero h2{font-size:22px;letter-spacing:-.01em}
.hero p{color:var(--ink2);max-width:44ch}
.hero .alt{border:0;background:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;padding:4px 0;align-self:flex-start}

/* day cards */
.days{display:flex;flex-direction:column;gap:10px}
.dc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;padding:10px 10px 10px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .15s,opacity .2s}
.dc.wk{background:linear-gradient(180deg,var(--weekend-soft),var(--surface) 70%)}
.dc.today{border-color:var(--pine);box-shadow:0 0 0 2px var(--pine-soft),var(--sh)}
.dc-main{min-width:0;border:0;background:none;text-align:left;padding:0;display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:center}
.dc:active{transform:scale(.995)}
.art{border-radius:16px;overflow:hidden;background:var(--line);display:block;flex:none;position:relative}
.art svg,.art img{display:block;width:100%;height:100%;object-fit:cover}
.dc .art{width:68px;height:68px}
.dc-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.dc-d{font:600 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;gap:8px;align-items:center}
.dc.today .dc-d{color:var(--pine)}
.dc.wk .dc-d{color:var(--weekend)}
.dc-n{font:700 17px/1.2 var(--f-display);overflow-wrap:break-word;hyphens:auto;text-wrap:balance}
.dc.done .dc-n{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1.5px}
.dc.done .art{opacity:.55}
.dc-m{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dc-a{display:flex;gap:2px;align-items:center}
.dc.lo{background:var(--surface2);border-style:dashed;box-shadow:none}
.dc.lo .art{opacity:.6}
.dc.lo .art::after{content:"↻";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#fff;background:rgba(16,34,26,.38)}
.dc.none{box-shadow:none;background:transparent;border-style:dashed}
.dc.none .art{background:transparent;display:grid;place-items:center;color:var(--ink2);border:1.5px dashed var(--line)}
.dc.none .art svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.ck{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s,transform .2s}
.ck svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ck.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.ol{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);text-decoration:none;flex:none}
.ol svg,.srcl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ol:hover,.srcl:hover{color:var(--pine)}
.srcl{display:inline-flex;align-items:center;gap:8px;color:var(--pine);font-weight:600;font-size:14.5px;text-decoration:none;padding:6px 0}
.srcl span{text-decoration:underline;text-underline-offset:3px}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.foot .btn{flex:1 1 auto}

/* shopping */
.stores{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(108px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:12px 2px 6px;margin:-12px 0 -6px;scrollbar-width:none}
.stores::-webkit-scrollbar{display:none}
.sto{scroll-snap-align:start}
.sto{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 12px 12px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--sh);transition:border-color .2s,background .2s,transform .12s;min-width:0}
.sto:active{transform:scale(.985)}
.sto[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft)}
.sto b{font:700 13px var(--f-display);color:var(--ink2);white-space:nowrap}
.sto .tot{font:600 21px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sto .tot small{font:500 12px var(--f-mono);color:var(--ink2);margin-left:2px}
.sto .sv{font-size:12px;color:var(--ink2)}
.sto .best{position:absolute;top:-9px;left:12px;background:var(--pine);color:var(--pine-ink);font:700 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.sto .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.sto .bar i{display:block;height:100%;background:var(--pine);border-radius:4px}
.reco{padding:16px;display:flex;flex-direction:column;gap:12px}
.reco .big{font:800 20px/1.2 var(--f-display);letter-spacing:-.01em}
.reco .big em{font-style:normal;color:var(--pine)}
.fine{font-size:12.5px;color:var(--ink2)}
.group{display:flex;flex-direction:column;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.it:last-child{border-bottom:0}
.it input{width:22px;height:22px;margin:0;accent-color:var(--pine)}
.it-n{font-weight:600;overflow-wrap:anywhere}
.it.on .it-n{text-decoration:line-through;color:var(--ink2)}
.it-m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--ink2);align-items:center}
.it-p{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.it-p .pr{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.it-p .pr.off{color:var(--offer)}
.it-x{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}

/* stock + recipe lists */
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600;overflow-wrap:anywhere;display:block}
.li .sub{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.li .qt{font:500 14px var(--f-mono);text-align:right}
.li.rec{grid-template-columns:48px minmax(0,1fr) auto;padding:10px 14px}
.li.rec .art{width:48px;height:48px;border-radius:13px}
.list{border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.stat{display:flex;flex-wrap:wrap;gap:6px}

/* forms + sheet */
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
input[type=checkbox]{accent-color:var(--pine)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;min-height:36px}
.chk input{width:20px;height:20px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 76px 66px 36px;gap:6px;align-items:center}
.ing input,.ing select{padding:8px 6px}
#sheet .scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:600px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;border:1px solid var(--line);box-shadow:var(--sh-up);
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sh-grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sh-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 0 10px;z-index:1}
.sh-body{display:flex;flex-direction:column;gap:14px}
.photo{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.photo input[type=file]{min-height:0;border:0;padding:0;background:none;font-size:14px}
.hero-img{border-radius:20px;overflow:hidden;aspect-ratio:16/10;position:relative;box-shadow:var(--sh)}
.hero-img .art{width:100%;height:100%;border-radius:0}
.hero-img .cam{position:absolute;right:10px;bottom:10px}
.cam{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--glass);color:var(--ink);font:600 13px var(--f-body);padding:9px 14px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cam svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kcal-line{display:flex;flex-wrap:wrap;gap:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--sh)}
.rv{display:grid;grid-template-columns:24px minmax(0,1fr) 78px 70px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}

/* segmented controls and toggles */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.seg button{min-height:42px;border:0;border-left:1px solid var(--line);background:none;font-weight:600;color:var(--ink2);transition:background .18s,color .18s}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pine-soft);color:var(--pine)}
.seg button[disabled]{opacity:.45;cursor:default}
.ingw{display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rl{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rl summary{padding:9px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.rl .rule{padding:4px 12px 12px}
.rule{display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--ink2)}
.lnk{background:none;border:0;color:var(--pine);font-weight:700;padding:4px 0;font-size:14px}

/* guide (ugens ønsker) */
.sheet.wiz{padding-bottom:0;display:flex;flex-direction:column;max-height:94dvh;overflow:hidden}
.wz-head{padding:12px 0 6px;display:flex;flex-direction:column;gap:10px}
.wz-top{display:flex;align-items:center;justify-content:space-between}
.wz-step{font:600 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.wz-bar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wz-bar i{height:4px;border-radius:4px;background:var(--line);transition:background .3s}
.wz-bar i.on{background:var(--pine)}
.wz-body{overflow:auto;padding:12px 2px 18px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.wz-q{font:800 24px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.wz-s{color:var(--ink2);max-width:46ch}
.wz-foot{border-top:1px solid var(--line);background:var(--bg);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}

  document.body.classList.add('lock');
}
function closeSheet(){if(S.ctl){try{S.ctl.abort()}catch(e){}S.ctl=null}$('#sheet').innerHTML='';document.body.classList.remove('lock');S.wz=null}
var opt=function(list,sel){return list.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>'}).join('')};

/* pick a recipe (or a freezer meal) for a day */
function openPick(i){
  var w=wid(),d=((S.plans[w]||{}).days||[])[i]||{},P=getPrefs(w);
  var ctx=ctxFor(w),list=Object.keys(S.recipes).map(function(id){return{id:id,s:fit(S.recipes[id],i,ctx,id)}}).sort(function(a,b){return b.s-a.s});
  var frz=stockItems().filter(function(p){return p.leftover&&curQty(p)>=1});
  var h='<p class="muted sm">'+DAYS[i]+' den '+parseYmd(addDays(S.mon,i)).getUTCDate()+'.</p>';
  if(d.r&&!d.lo)h+='<button class="lowcard" role="switch" aria-checked="'+(!!d.dbl)+'" data-act="togdbl" data-i="'+i+'"><span class="lc"><b>Dobbelt portion</b><span>Så er der rester til '+(i<6?DAYS[i+1].toLowerCase():'mandag i næste uge')+'.</span></span><span class="sw"></span></button>';
  h+='<div class="sec"><div class="list"><button class="li rec" data-act="setoff" data-i="'+i+'"><span class="art plate">'+PLATE+'</span><span><span class="nm">Ude eller ingen mad</span><span class="sub">Ingen indkøb til denne dag</span></span><span></span></button></div></div>';
  if(frz.length)h+='<div class="sec"><div class="lbl">Fra fryseren</div><div class="list">'+frz.map(function(p){return '<button class="li" data-act="setfrz" data-i="'+i+'" data-k="'+esc(p.k)+'"><span><span class="nm">'+esc(p.name)+'</span></span><span class="qt">'+pq(p,curQty(p))+'</span></button>'}).join('')+'</div></div>';
  h+='<div class="sec"><div class="lbl">Retter</div><div class="list">'+list.map(function(x){var r=S.recipes[x.id],m=recMeta(r,P.low);
    var ch=(r.fav?'<span class="hrt">♥</span>':'')+(ctx.tasteAny&&!r.fav&&ctx.taste[x.id]>.5?'<span class="chip">Passer din smag</span>':'')+(r.again==='no'?'<span class="chip off">Ikke igen</span>':'')+(r.again==='yes'?'<span class="chip ex">Gentag</span>':'')+dietChip(r);
    return '<button class="li rec" data-act="setday" data-i="'+i+'" data-id="'+x.id+'">'+artBox(r,x.id)+'<span><span class="nm">'+esc(r.name)+'</span>'+((m||ch)?'<span class="sub">'+m+ch+'</span>':'')+'</span><span></span></button>'}).join('')+'</div></div>';
  if(d.r||d.f)h+='<button class="btn danger" data-act="setday" data-i="'+i+'" data-id="">Fjern fra dagen</button>';
  openSheet('Vælg ret',h);
}

/* recipes */

  Object.keys(books).sort(function(a,b){return a==='Egne retter'?1:b==='Egne retter'?-1:a.localeCompare(b,'da')}).forEach(function(b){

function ruleHtml(p){
  var r=ruleOf(p);
  return '<div class="rule"><div class="field"><label>Hvornår kommer den på indkøbslisten?</label><select class="r-mode">'+opt([['under','Når lageret er under en grænse'],['days','Når der er få dage tilbage'],['out','Når den er brugt op'],['never','Aldrig automatisk']],r.rule)+'</select></div>'+
    '<div class="grid2"><div class="field r-f-under"'+(r.rule==='under'?'':' hidden')+'><label>Grænse</label><input class="r-min" inputmode="decimal" value="'+esc(dec(r.min))+'"></div>'+
    '<div class="field r-f-days"'+(r.rule==='days'?'':' hidden')+'><label>Dage tilbage</label><input class="r-days" inputmode="decimal" value="'+esc(dec(r.days))+'"></div>'+
    '<div class="field r-f-use"'+(r.rule==='never'?' hidden':'')+'><label>Forbrug pr. uge (valgfri)</label><input class="r-use" inputmode="decimal" value="'+(r.use?esc(dec(r.use)):'')+'"></div>'+
    '<div class="field"><label>Pakkestørrelse</label><input class="r-pack" inputmode="decimal" value="'+(r.pack?esc(dec(r.pack)):'')+'"></div></div></div>';
}
function readRule(el){var g=function(c){return el.querySelector(c)};return{rule:g('.r-mode').value,min:Math.max(0,num(g('.r-min').value)),days:Math.max(0,num(g('.r-days').value)),use:Math.max(0,num(g('.r-use').value)),pack:Math.max(0,num(g('.r-pack').value))}}
function syncRule(el){var m=el.querySelector('.r-mode').value;el.querySelector('.r-f-under').hidden=m!=='under';el.querySelector('.r-f-days').hidden=m!=='days';el.querySelector('.r-f-use').hidden=m==='never'}
function refreshSummary(row){
  if(!row)return;var s=row.querySelector('summary'),rule=row.querySelector('.rule'),u=row.querySelector('.i-u');
  if(s&&rule)s.textContent=ruleSummary(readRule(rule),u?u.value:'g');

    '<div class="grid3"><div class="field"><label for="rf-kind">Type</label><select id="rf-kind">'+opt([['hverdag','Hverdag'],['weekend','Weekend']],r?r.kind:'hverdag')+'</select></div><div class="field"><label for="rf-min">Minutter</label><input id="rf-min" inputmode="numeric" value="'+(r&&r.minutes?r.minutes:'')+'"></div><div class="field"><label for="rf-rate">Vurdering</label><select id="rf-rate">'+opt([['0','Ingen'],['1','1/5'],['2','2/5'],['3','3/5'],['4','4/5'],['5','5/5']],String(r?Math.round(r.rating||0):0))+'</select></div></div>'+

function kalc(r){var k=kcalOf(r);return k.k>KALLOW+5?'ca. '+k.k+' kcal pr. portion':''}
function collectIng(){
  return Array.prototype.map.call(document.querySelectorAll('#rf-ings .ingw'),function(row){return{n:row.querySelector('.i-n').value.trim().toLowerCase(),q:num(row.querySelector('.i-q').value),u:row.querySelector('.i-u').value,rule:readRule(row.querySelector('.rule'))}}).filter(function(g){return g.n&&g.q>0});
}
function saveRecipe(id){
  var name=$('#rf-name').value.trim(),rows=collectIng();
  if(!name){toast('Giv retten et navn');return}
  if(!rows.length){toast('Tilføj mindst én ingrediens med mængde');return}
  var old=id?S.recipes[id]:null,rid=id||uid(),t=todayStr();
  var doc=Object.assign({},old||{},{name:name,book:$('#rf-book').value.trim(),page:Math.round(num($('#rf-page').value))||0,kind:$('#rf-kind').value,minutes:Math.round(num($('#rf-min').value))||0,rating:Number($('#rf-rate').value)||0,prot:$('#rf-prot').value,rest:$('#rf-rest').checked,fav:$('#rf-fav').checked,again:$('#rf-again').value,method:$('#rf-method').value.replace(/\r/g,'').trim(),ing:rows.map(function(g){return{n:g.n,q:g.q,u:g.u}}),example:false,url:safeUrl($('#rf-url').value),made:(old&&old.made)||{count:0,last:'',wd:[0,0,0,0,0,0,0]}});
  save(function(){
    var patch={},items=S.praw||{};
    rows.forEach(function(g){var k=slug(g.n),o=items[k],r=g.rule;
      if(!o){var rf=(S.ref.items||{})[k];patch[k]=Object.assign({name:g.n,unit:g.u,qty:0,price:0,perish:!!(rf&&rf.perish&&rf.unit===g.u),cat:(rf&&rf.cat)||'Andet',expires:'',at:t},r)}
      else patch[k]=Object.assign({},r,(r.use>0&&!o.at)?{at:t}:{});
    });
    return up(udoc('store/pantry'),{items:patch}).then(function(){return udoc('recipes/'+rid).set(doc)}).then(function(){openRecipes();toast('Ret gemt')});
  });
}
function readRecipe(){
  var files=$('#rf-file').files,st=$('#rf-st');
  if(!files||!files.length){st.textContent='Vælg et billede først.';return}
  if(!S.sample||!S.imgOK){st.textContent='Fotolæsning er ikke tilgængelig her. Skriv ingredienserne ind selv.';return}
  S.ctl=new AbortController();$('#rf-read').disabled=true;
  st.innerHTML='Læser billedet…'+(window.UGEKURV_WEB&&!window.UgekurvOCR?' Første gang hentes tekstlæseren, det kan tage lidt.':'')+' <button class="btn ghost sm" data-act="stopread">Stop</button>';
  var prompt='Billederne viser en opskrift fra en kogebog, som tilhører brugeren, til privat brug. Udtræk KUN retnavn, ca. tilberedningstid i minutter, antal portioner opskriften er skrevet til og ingredienslisten. Kopiér ikke fremgangsmåden. Omregn alle mængder til g, ml eller stk (1 dl = 100 ml, 1 spsk = 15 ml, 1 tsk = 5 ml, 1 kg = 1000 g, 1 l = 1000 ml). Udelad salt, peber og vand. Skriv ingrediensnavne med små bogstaver i ubestemt form, fx "hakket oksekød" eller "løg". Svar kun med JSON: {"name":string,"minutes":number|null,"servings":number,"ingredients":[{"n":string,"q":number,"u":"g"|"ml"|"stk"}]}';
  S.sample.json(prompt,{images:files,signal:S.ctl.signal}).then(function(res){
    var f=2/(num(res.servings)>0?num(res.servings):2);
    var rows=(res.ingredients||[]).filter(function(g){return g&&g.n&&num(g.q)>0}).map(function(g){var u=UNITS.indexOf(g.u)>-1?g.u:'stk',q=num(g.q)*f;q=u==='stk'?Math.round(q*2)/2:q>=20?Math.round(q/5)*5:r1(q);return{n:String(g.n).toLowerCase(),q:q||1,u:u}});
    if(!rows.length){st.textContent='Kunne ikke finde en ingrediensliste. Prøv et skarpere billede.';return}
    if(!$('#rf-name').value&&res.name)$('#rf-name').value=res.name;
    if(res.minutes)$('#rf-min').value=Math.round(num(res.minutes));
    $('#rf-ings').innerHTML=rows.map(ingRow).join('');
    st.textContent='Ingredienserne er indsat. Tjek mængderne og tryk Gem ret.';
  }).catch(function(e){
    var c=e&&e.code;st.textContent=c==='cancelled'?'Stoppet.':c==='not_granted'?'Du har ikke givet appen lov til at bruge Claude.':c==='rate_limited'?'For mange forsøg. Vent lidt og prøv igen.':c==='invalid_json'||c==='refused'||c==='image_rejected'?'Kunne ikke læse billedet. Prøv et skarpere billede.':c==='unavailable'&&window.UGEKURV_WEB?'Tekstlæseren kunne ikke hentes. Tjek nettet og prøv igen. Første gang skal der hentes en sprogfil.':'Noget gik galt. Prøv igen.';
  }).then(function(){S.ctl=null;var b=$('#rf-read');if(b)b.disabled=false});
}
/* own photo of a dish */
function resizeImage(file,max){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',.82)};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url;
  });
}
function handlePhoto(file,id){
  if(!file||!S.assets||!id||!S.recipes[id])return;
  toast('Gemmer foto…');
  resizeImage(file,1400).then(function(b){return S.assets.upload(b)}).then(function(res){
    var old=S.recipes[id].img;
    return up(udoc('recipes/'+id),{img:{id:res.id}}).then(function(){
      S.recipes[id]=Object.assign({},S.recipes[id],{img:{id:res.id}});
      var el=$('#hero-box');if(el)el.innerHTML=heroHtml(id,S.recipes[id]);
      if(old&&old.id&&S.assets.delete)S.assets.delete(old.id).catch(function(){});
      toast('Foto gemt');draw();
    });
  }).catch(function(e){console.error(e);toast('Kunne ikke gemme fotoet')});
}

/* Sunday double portion -> Monday next week is leftovers (and the other way round) */
function syncCarry(w,days){
  var nw=weekId(addDays(monOfWeek(w),7)),np=S.plans[nw];if(!np||!np.days)return;
  var sun=days[6],want=sun&&sun.r&&sun.dbl&&!sun.off&&!sun.lo&&!sun.f?sun.r:'',nd=fillDays(np.days.map(function(x){return Object.assign({},x)})),cur=nd[0]||{},isCarry=!!(cur.lo&&cur.from===-1);
  if(want){
    if(cur.r&&!isCarry&&(cur.lock||cur.done||cur.f))return;
    if(isCarry&&cur.r===want)return;
    nd[0]={r:want,lo:true,from:-1,done:!!(isCarry&&cur.done),lock:false};
  }else if(isCarry){nd[0]={r:'',done:false,lock:false}}
  else return;
  return udoc('plans/'+nw).set({week:nw,start:monOfWeek(nw),days:nd,gen:np.gen||Date.now()});
}

  var ids=daysIds(days),B=weekBudget(),nfree=days.filter(function(d){return d&&!d.r&&!d.off&&!d.f&&!d.lo}).length;
  if(GEN_WHY==='few'&&nfree)S.planNote='Kun '+(7-nfree)+' retter passer til dine valg. Tilføj flere retter.';
  else if(B>0){var est=planEst(ids);if(est>B*1.05)S.planNote='Ca. '+kr(Math.round(est-B))+' over dit budget.'}
  var su0=stockUse(ids,ctxFor(w).exp),un=su0.used.filter(function(x){return x.urgent});
  if(un.length)S.planNote=(S.planNote?S.planNote+' ':'')+'Bruger '+un.slice(0,3).map(function(x){return x.name.toLowerCase()}).join(', ')+' fra lageret.';
  var P=getPrefs(w);

      var L=S.lists[w]||{};
      if(S.settings.candy&&!P.low&&!L.slik)return up(udoc('lists/'+w),{extra:(L.extra||[]).concat([{id:'slik',name:'Weekendslik'}]),slik:true});

  logout:function(){var W=window.UGEKURV_WEB;if(W)W.signOut()},
  obnext:function(){
    var f=readForm('ob'),m=document.querySelector('input[name="ob-m"]:checked'),mode=m?m.value:'empty';
    S.ob=Object.assign(f,{mode:mode});

  obback:function(){openOnboard()},
  obfinish:function(){
    var o=Object.assign({},OB0,{stores:STORES.slice(),mode:'empty'},S.ob||{}),fav=(S.fv&&S.fv.mode==='onboard')?S.fv.sel:{};

      var t=todayStr(),ps=[];

        var items={};Object.keys(S.ref.items||{}).forEach(function(k){items[k]=Object.assign({},S.ref.items[k],{qty:0,at:t,rule:'never',min:0,use:0,days:2,expires:'',ex:false,price:0})});

      }
      var st=normSettings({adults:o.adults,kids:o.kids,budget:o.budget,budgetPer:o.budgetPer,veg:o.veg,quick:o.quick,allergens:o.allergens,oko:!!o.oko,free:!!o.free,friWeekend:true,candy:true,drive:40,stores:o.stores,example:false});
      return Promise.all(ps).then(function(){return udoc('store/settings').set(st)}).then(function(){S.ob=null;S.fv=null;closeSheet();S.wzChecked=false;maybeWizard();if(!$('#sheet').firstChild)toast('Klar. Du kan nu lave din første madplan.')});

  favs:function(){openFavs('edit')},
  fvtog:function(d,el){
    if(!S.fv)return;var on=!S.fv.sel[d.id];S.fv.sel[d.id]=on;
    el.setAttribute('aria-pressed',String(on));var hb=el.querySelector('.hb');if(hb)hb.textContent=on?'♥':'♡';favNote();
  },
  fvsave:function(){
    var sel=S.fv.sel,orig=S.fv.orig,ps=[];
    Object.keys(S.recipes).forEach(function(id){var now=!!sel[id],was=!!orig[id];if(now!==was)ps.push(up(udoc('recipes/'+id),{fav:now}))});
    save(function(){return Promise.all(ps).then(function(){S.fv=null;openRecipes();toast(ps.length?'Favoritter gemt':'Ingen ændringer')})});
  },
  cook:function(d){openCook(d.id)},
  rateopen:function(d,el,e){var w=wid(),day=((S.plans[w]||{}).days||[])[Number(d.i)];if(day&&day.r)openRate(day.r,Number(d.i))},
  rate:function(d){
    if(!S.rt)return;S.rt.s=Number(d.s);
    if(!S.rt.touched)S.rt.again=S.rt.s>=4?'yes':S.rt.s<=2?'no':'maybe';
    rateDraw();
  },
  again:function(d){if(!S.rt)return;S.rt.again=d.v;S.rt.touched=true;rateDraw()},
  ratesave:function(){
    var rt=S.rt;if(!rt)return;if(!(rt.s>0)){toast('Vælg antal stjerner');return}
    var r=S.recipes[rt.id];if(!r)return;
    var hist=(r.hist||[]).concat([{d:addDays(monOfWeek(rt.w),rt.i),s:rt.s}]).slice(-5),l3=hist.slice(-3),avg=Math.round(l3.reduce(function(a,x){return a+x.s},0)/l3.length*10)/10,ag=rt.again||'maybe';
    save(function(){
      return up(udoc('recipes/'+rt.id),{hist:hist,rating:avg,again:ag}).then(function(){
        var days=fillDays(daysOf(rt.w));if(days[rt.i]&&days[rt.i].r===rt.id){days[rt.i]=Object.assign({},days[rt.i],{rate:rt.s});return savePlanDays(rt.w,days)}
      }).then(function(){S.rt=null;closeSheet();toast(ag==='yes'?'Gemt. Retten kommer igen senere':ag==='no'?'Gemt. Retten vælges ikke igen':'Tak for din vurdering')});
    });
  },
  getstarter:function(){
    var ids=Object.keys(S.starter).filter(function(id){return !S.recipes[id]});if(!ids.length)return;
    save(function(){
      var recs=ids.map(function(id){return freshRecipe(S.starter[id])}),patch=missingItems(recs),ps=[];
      if(Object.keys(patch).length)ps.push(up(udoc('store/pantry'),{items:patch}));
      ids.forEach(function(id,i){ps.push(udoc('recipes/'+id).set(recs[i]))});
      return Promise.all(ps).then(function(){openRecipes();toast(ids.length+' startretter hentet')});
    });
  },
  clearex:function(){
    save(function(){
      var keep={},del=[];
      Object.keys(S.recipes).forEach(function(id){var r=S.recipes[id];if(r.example)del.push(id);else(r.ing||[]).forEach(function(g){keep[slug(g.n)]=1})});
      var items=Object.assign({},S.praw);Object.keys(items).forEach(function(k){if(!items[k].ex)return;if(keep[k])items[k]=Object.assign({},items[k],{qty:0,at:todayStr(),ex:false});else delete items[k]});
      return Promise.all(del.map(function(id){return udoc('recipes/'+id).delete()})).then(function(){return udoc('store/pantry').set({items:items})}).then(function(){return up(udoc('store/settings'),{example:false})}).then(function(){toast('Eksempeldata er ryddet')});
    });
  }
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=ACT[el.dataset.act];if(f)f(el.dataset,el,e)});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.matches)return;
  if(t.matches('[data-chk]')){
    var w=wid(),key=t.dataset.chk,v=t.checked,L=S.lists[w]||{},c=Object.assign({},L.checked||{});c[key]=v;
    S.lists[w]=Object.assign({},L,{checked:c});draw();
    var p={};p[key]=v;save(function(){return up(udoc('lists/'+w),{checked:p})});
  }else if(t.id==='rf-photo'){handlePhoto(t.files&&t.files[0],t.dataset.id);t.value=''}
  else if(t.matches('.r-mode')){syncRule(t.closest('.rule'));refreshSummary(t.closest('.ingw'))}
  else if(t.name==='ob-m'){var g=$('#ob-go');if(g)g.textContent=t.value==='starter'&&Object.keys(S.starter).length?'Næste: vælg favoritter':'Kom i gang'}

    var row=t.closest('.ingw'),p2=pan(slug(t.value));
    if(row&&p2){row.querySelector('.i-u').value=p2.unit;row.querySelector('.rl').innerHTML='<summary>'+esc(ruleSummary(ruleOf(p2),p2.unit))+'</summary>'+ruleHtml(p2)}

});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='sq'){S.q=t.value;var l=$('#stockList');if(l)l.innerHTML=stockListHtml()}
  else if(t.matches&&t.matches('.r-min,.r-days,.r-use,.r-pack')){refreshSummary(t.closest('.ingw'))}
  else if(/^(st|ob)-(a|k)$/.test(t.id||'')){hhUpdate(t.id.slice(0,2))}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#sheet').firstChild){if(S.wz)ACT.wzclose();else closeSheet()}
  if(e.key==='Enter'&&e.target.id==='xin'){e.preventDefault();ACT.addx()}
});
/* a photo that cannot load falls back to the drawn plate */
document.addEventListener('error',function(e){
  var t=e.target;if(!t||t.tagName!=='IMG'||t.dataset.fb===undefined)return;
  var id=t.dataset.fb,r=Object.assign({},S.recipes[id]||{});delete r.img;var p=t.parentNode;if(p)p.innerHTML=artSVG(Object.assign({id:id},r),p.classList&&p.classList.contains('wide'));
},true);

/* ---------- data ---------- */
function ready(k){S.ready[k]=1;render();maybeOnboard();maybeWizard()}
function fromCol(snap,key){var o={};snap.docs.forEach(function(d){o[d.id]=d.data()});S[key]=o;ready(key)}
function sub(q,fn){q.onSnapshot(fn,function(e){console.error(e);if(e&&e.code==='revoked'){S.ro=true}render()})}
function boot(){
  draw();
  var c=window.claude;
  if(!c||!c.use){S.nodb=true;draw();return}
  c.use('db').then(function(d){
    db=d;if(!db){S.nodb=true;draw();return}
    setTimeout(function(){if(!S.ready.pantry){S.slow=true;render()}},10000);
    return c.use('user').then(function(us){return us&&us.id?us.id():null}).catch(function(){return null}).then(function(id){
      if(!id){S.nodb=true;draw();return}
      S.uid=id;UB='data/users/'+id+'/u/';
      sub(udoc('store/pantry'),function(s){S.hasPantry=!!s.exists;var d=s.exists?s.data():{};S.praw=d.items||{};applyRef();ready('pantry')});
      sub(udoc('store/brands'),function(s){var d=s.exists?s.data():{};S.brands=d.b||{};S.bnames=d.n||{};render()});
      sub(udoc('store/settings'),function(s){S.hasSettings=!!s.exists;S.settings=normSettings(s.exists?s.data():{});ready('settings')});
      sub(ucol('recipes'),function(s){fromCol(s,'recipes')});
      sub(ucol('plans'),function(s){fromCol(s,'plans')});
      sub(ucol('prefs'),function(s){fromCol(s,'prefs')});
      sub(ucol('lists'),function(s){fromCol(s,'lists')});
      sub(db.collection('offers'),function(s){fromCol(s,'offers')});
      sub(db.collection('ref'),function(s){var o={};s.docs.forEach(function(x){o[x.id]=x.data()});S.ref={stores:o.stores||{},items:(o.items&&o.items.items)||{}};applyRef();ready('ref')});
      sub(db.collection('starter'),function(s){fromCol(s,'starter')});
    });
  }).catch(function(){S.nodb=true;draw()});
  c.use('user').then(function(u){if(u&&u.can&&u.can('data.write')===false){S.ro=true;render()}}).catch(function(){});
  c.use('assets').then(function(a){S.assets=a||null;render()}).catch(function(){});
  c.use('sample').then(function(sm){
    S.sample=sm;if(sm&&sm.limits)return sm.limits().then(function(l){S.imgOK=!!(l&&l.images)}).catch(function(){})
  }).catch(function(){});
}
