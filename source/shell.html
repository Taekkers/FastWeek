<title>Ugekurv</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column built from ruled lists, like a pinned weekly slip; sticky header, bottom tab bar. Tilbud-red is reserved for prices, amber marks the weekend. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#16231D; --ink2:#52625A; --line:#D8DED7;
  --pine:#1E5A41; --pine-ink:#FFFFFF; --pine-soft:#DDEBE2;
  --offer:#C8202B; --offer-soft:#FBE4E5;
  --weekend:#8A5A0B; --weekend-soft:#F6EBD3;
  --warn:#9A5400; --scrim:rgba(14,22,18,.45);
  --f-display:'Schibsted Grotesk',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-body:'Schibsted Grotesk',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101713; --surface:#18221D; --ink:#E8EEEA; --ink2:#9DAEA5; --line:#2A3830;
  --pine:#55BA88; --pine-ink:#0B1A12; --pine-soft:#1B3327;
  --offer:#FF7079; --offer-soft:#3A1B1E;
  --weekend:#E6B65E; --weekend-soft:#2F2819;
  --warn:#F0A94B; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101713; --surface:#18221D; --ink:#E8EEEA; --ink2:#9DAEA5; --line:#2A3830;
  --pine:#55BA88; --pine-ink:#0B1A12; --pine-soft:#1B3327;
  --offer:#FF7079; --offer-soft:#3A1B1E;
  --weekend:#E6B65E; --weekend-soft:#2F2819;
  --warn:#F0A94B; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 104px;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
h1{font:800 24px/1.15 var(--f-display);text-wrap:balance}
h2{font:700 17px/1.25 var(--f-display);text-wrap:balance}
.lbl{font:600 11.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.sm{font-size:13px}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font:800 21px/1 var(--f-display);letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--pine)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--ink2);font:600 11.5px var(--f-body);border-radius:10px}
.tab[aria-current="page"]{color:var(--pine);background:var(--pine-soft)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--pine);background:var(--pine);color:var(--pine-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--pine)}
.btn.danger{background:transparent;border-color:var(--offer);color:var(--offer)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:default}
.x{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--ink2);font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.chip{display:inline-block;font:600 11.5px var(--f-body);padding:2px 8px;border-radius:999px;background:var(--pine-soft);color:var(--pine);white-space:nowrap}
.chip.wk{background:var(--weekend-soft);color:var(--weekend)}
.chip.off{background:var(--offer-soft);color:var(--offer)}
.chip.warn{background:var(--weekend-soft);color:var(--warn)}
.chip.ex{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.price{font:500 14px var(--f-mono);color:var(--offer);font-variant-numeric:tabular-nums}
.was{font:400 12px var(--f-mono);color:var(--ink2);text-decoration:line-through}

/* sections */
#view{max-width:640px;margin:0 auto;padding-block:16px 0;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{max-width:46ch}

/* week navigator */
.wnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px}
.wnav .x{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;font-size:24px}
.wnav div.c{text-align:center}
.wt{font:800 22px/1.1 var(--f-display)}
.wr{font-size:13px;color:var(--ink2)}

/* plan */
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.day:first-child{border-top:1px solid var(--line)}
.day.wk{background:var(--weekend-soft);margin-inline:-16px;padding-inline:16px}
.dl{display:flex;flex-direction:column;line-height:1.15}
.dl b{font:600 13px var(--f-mono)}
.dl span{font:400 12px var(--f-mono);color:var(--ink2)}
.day.today .dl b{color:var(--pine)}
.dm{min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:3px}
.dn{font:700 16px/1.25 var(--f-display);overflow-wrap:anywhere}
.day.done .dn{color:var(--ink2);text-decoration:line-through}
.dmeta{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.da{display:flex;gap:6px;align-items:center}
.ck{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink2);display:grid;place-items:center;padding:0}
.ck svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ck.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.ck.lk.on{background:var(--weekend);border-color:var(--weekend);color:var(--bg)}
.ol{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);text-decoration:none;flex:none}
.ol svg,.srcl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ol:hover,.srcl:hover{color:var(--pine)}
.srcl{display:inline-flex;align-items:center;gap:8px;color:var(--pine);font-weight:600;font-size:14.5px;text-decoration:none;padding:6px 0;margin-bottom:4px}
.srcl span{text-decoration:underline;text-underline-offset:3px}
.rest{display:flex;flex-direction:column;gap:6px}
.rest ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.rest li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}
.sugg{display:flex;flex-direction:column}
.sg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.sg b{font:700 15px var(--f-display)}

/* shopping */
.route{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.route .big{font:800 20px/1.2 var(--f-display)}
.route table{border-collapse:collapse;width:100%;font-size:13.5px}
.route td{padding:5px 0;border-top:1px solid var(--line)}
.route td:last-child{text-align:right}
.group{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.it input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--pine)}
.it-n{font-weight:600;overflow-wrap:anywhere}
.it.on .it-n{text-decoration:line-through;color:var(--ink2)}
.it-m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--ink2);align-items:center}
.it-o{display:block;font-size:13px;font-weight:600;color:var(--offer)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}

/* stock + recipes lists */
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.li .nm{font-weight:600;overflow-wrap:anywhere}
.li .sub{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.li .qt{font:500 14px var(--f-mono);text-align:right}
.stat{display:flex;flex-wrap:wrap;gap:6px}

/* forms + sheet */
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
input[type=checkbox]{accent-color:var(--pine)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;min-height:36px}
.chk input{width:20px;height:20px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 76px 66px 36px;gap:6px;align-items:center}
.ing input,.ing select{padding:8px 6px}
#sheet .scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:600px;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;border:1px solid var(--line);
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;z-index:1}
.sh-body{display:flex;flex-direction:column;gap:14px}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.photo{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.photo input[type=file]{min-height:0;border:0;padding:0;background:none;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px)}
.rv{display:grid;grid-template-columns:24px minmax(0,1fr) 78px 70px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rv input[type=text],.rv input:not([type]){padding:6px;min-height:40px}

/* overview, segmented control, rules */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:12px 8px 12px 12px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{font:600 28px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink2)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lnk{background:none;border:0;color:var(--pine);font-weight:700;padding:4px 0;font-size:14px}
.mini{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.mini.wk{background:var(--weekend-soft);margin-inline:-16px;padding-inline:16px;width:calc(100% + 32px)}
.mini b{font:600 13px var(--f-mono)}
.mini .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mini.done .mn{color:var(--ink2);text-decoration:line-through}
.mini .tk{width:18px;height:18px;fill:none;stroke:var(--pine);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:40px;border:0;border-left:1px solid var(--line);background:none;font-weight:600;color:var(--ink2)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pine-soft);color:var(--pine)}
.ingw{display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rl{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rl summary{padding:8px 10px;font-size:13px;color:var(--ink2);cursor:pointer}
.rl .rule{padding:4px 10px 12px}
.rule{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.hint{font-size:13px;color:var(--ink2)}
@media (max-width:380px){.ing{grid-template-columns:minmax(0,1fr) 64px 60px 32px}.rv{grid-template-columns:24px minmax(0,1fr) 64px 60px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header id="top"><div class="top-in"><button class="icon-btn" data-act="menu" id="menubtn" aria-label="Åbn menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="brand">Fast<i>Week</i></div><span class="cur" id="cur"></span></div></header>
<main id="view" aria-live="polite"></main>
<div id="menu" hidden></div>
<div id="sheet"></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var DAY=864e5;
var DAYS=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
var DS=['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
var MON=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
var STORES=['Netto','Føtex','Bilka','Rema 1000','Coop'];
var CATS=['Frugt & grønt','Kød & fisk','Mejeri & æg','Kolonial','Frost','Andet'];
var UNITS=['g','ml','stk'];
var PROTS=[['','Ingen/andet'],['okse','Okse'],['kylling','Kylling'],['svin','Svin'],['fisk','Fisk'],['vegetar','Vegetar'],['aeg','Æg']];
var DEF={persons:2,friWeekend:false,candy:true,welfare:true,drive:40,stores:STORES.slice(),example:false};
var LINK='<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var LOCK='<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

/* ---------- helpers ---------- */
var slug=function(s){return String(s||'').toLowerCase().trim().replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x'};
var nf=function(n,d){return Number(n).toLocaleString('da-DK',{maximumFractionDigits:d==null?1:d})};
var kr=function(n){n=Number(n)||0;return n.toLocaleString('da-DK',{minimumFractionDigits:(Math.round(n*100)%100?2:0),maximumFractionDigits:2})+' kr'};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
var r1=function(n){return Math.round(n*10)/10};
var dec=function(n){return String(n).replace('.',',')};
function fq(q,u){q=Number(q)||0;if(u==='g'&&q>=1000)return nf(q/1000,2)+' kg';if(u==='ml'&&q>=1000)return nf(q/1000,2)+' l';return nf(q,1)+' '+u}
function pq(p,q){return p.leftover?nf(q,1)+' port.':fq(q,p.unit)}
var uid=function(){return Math.random().toString(36).slice(2,9)};
function parseYmd(s){var p=String(s).split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]))}
function ymd(d){return d.toISOString().slice(0,10)}
function todayStr(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function addDays(s,n){return ymd(new Date(parseYmd(s).getTime()+n*DAY))}
function mondayOf(s){var d=parseYmd(s);var wd=(d.getUTCDay()+6)%7;return ymd(new Date(d.getTime()-wd*DAY))}
function isoWeek(s){var d=parseYmd(s);var day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);var y=d.getUTCFullYear();var f=new Date(Date.UTC(y,0,4));var fd=(f.getUTCDay()+6)%7;f.setUTCDate(f.getUTCDate()-fd+3);return[y,1+Math.round((d-f)/(7*DAY))]}
function weekId(mon){var w=isoWeek(mon);return w[0]+'-W'+String(w[1]).padStart(2,'0')}
function daysBetween(a,b){var x=(parseYmd(b)-parseYmd(a))/DAY;return isFinite(x)?x:999}
function fmtDate(d){var x=parseYmd(d);return x.getUTCDate()+'. '+MON[x.getUTCMonth()]}

/* ---------- state ---------- */
var S={tab:'week',mon:mondayOf(todayStr()),recipes:{},pantry:{items:{}},settings:Object.assign({},DEF),plans:{},offers:{},lists:{},
  ready:{},q:'',nodb:false,slow:false,ro:false,sample:null,imgOK:false,ctl:null};
var db=null,raf=0;
var isWeekend=function(i){return i>=5||(i===4&&S.settings.friWeekend)};
var wid=function(){return weekId(S.mon)};
var pan=function(k){return (S.pantry.items||{})[k]};

/* ---------- writes ---------- */
function up(ref,data){return ref.update(data).catch(function(e){if(e&&e.code==='invalid_argument')return ref.set(data);throw e})}
function save(fn){return Promise.resolve().then(fn).catch(function(e){console.error(e);toast('Kunne ikke gemme. Prøv igen.')})}
var tt=0;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2800)}

/* ---------- stock model ---------- */
/* Estimated quantity: counted quantity minus weekly use since the last count. */
function curQty(p){var q=Number(p.qty)||0;if(p.use>0&&p.at){var d=daysBetween(p.at,todayStr());if(d>0)q=Math.max(0,q-p.use*d/7)}return q}
function reserve(p){var m=p.rule||'under';if(m==='under')return p.min||0;if(m==='days')return (p.use||0)*(p.days||0)/7;return 0}
function isLow(p){if(p.leftover)return false;var m=p.rule||'under',c=curQty(p);if(m==='never')return false;if(m==='out')return c<=1e-6;var r=reserve(p);return r>0&&c<r-1e-9}
function qpatch(q){return{qty:r1(Math.max(0,q)),at:todayStr()}}
function ruleOf(p){p=p||{};return{rule:p.rule||'under',min:p.min||0,days:p.days||2,use:p.use||0,pack:p.pack||0}}
function ruleSummary(r,u){
  if(r.rule==='never')return 'Ingen automatisk køb';
  if(r.rule==='out')return 'Køb når den er brugt op';
  if(r.rule==='days')return r.use>0?'Køb når der er under '+nf(r.days,1)+' dage tilbage':'Angiv forbrug pr. uge';
  return r.min>0?'Køb når under '+fq(r.min,u||'g'):'Ingen grænse sat';
}

/* ---------- offers ---------- */
function words(s){return String(s||'').toLowerCase().replace(/[^a-zæøå0-9 ]+/g,' ').split(/\s+/).filter(Boolean)}
function nameMatch(itemName,offerName){
  var iw=words(itemName),ow=words(offerName);if(!iw.length||!ow.length)return false;
  return iw.every(function(w){return ow.some(function(o){return o.indexOf(w)===0||(o.length>=5&&w.indexOf(o)===0)})});
}
/* økologi / god dyrevelfærd: gælder varer, der har en pris for den kvalitet (kød og fisk) */
function qual(k){var p=pan(k);return !!(S.settings.welfare&&p&&p.kpg>0)}
function qualOk(o,it){return !qual(it.k)||o.q==='oko'||o.q==='god'}
function offerMatch(o,it){if(!qualOk(o,it))return false;if(o.match)return slug(o.match)===it.k;return nameMatch(it.name,o.name)}
/* overslag: kr pr. kg, liter eller stk gange den mængde, der skal købes */
function ppu(p){if(!p)return 0;return (S.settings.welfare&&p.kpg>0)?p.kpg:(p.kp||0)}
function lineCost(it){var p=pan(it.k);if(!p||p.unit!==it.unit)return 0;var u=ppu(p);if(!(u>0))return 0;return it.unit==='stk'?it.qty*u:it.qty/1000*u}
function activeOffers(w){return ((S.offers[w]||{}).items||[]).filter(function(o){return S.settings.stores.indexOf(o.store)>-1})}
function ofactor(o,it){if(o.qty>0&&o.unit===it.unit)return Math.max(1,Math.ceil(it.qty/o.qty-1e-9));return it.packs||1}
function bestOffer(it,w){
  var best=null;activeOffers(w).forEach(function(o){if(!offerMatch(o,it))return;var f=ofactor(o,it);var c=o.price*f;if(!best||c<best.cost)best={o:o,cost:c,sv:o.was>o.price?(o.was-o.price)*f:0}});
  return best;
}
/* ---------- needs, shopping list, waste, coverage ---------- */
function aggNeeds(ids){
  var sc=(S.settings.persons||2)/2,m={};
  ids.forEach(function(id){var r=S.recipes[id];if(!r)return;(r.ing||[]).forEach(function(g){var k=slug(g.n),key=k+'|'+g.u;m[key]=m[key]||{k:k,name:g.n,unit:g.u,need:0};m[key].need+=g.q*sc})});
  return m;
}
function planIds(w,includeDone){var p=S.plans[w];return ((p&&p.days)||[]).filter(function(d){return d.r&&(includeDone||!d.done)}).map(function(d){return d.r})}
function buyCalc(stock,min,pack,need,unit){
  var after=stock-need;if(after>=min-1e-9)return null;
  var buy=min-after,packs,qty;
  if(pack>0){packs=Math.ceil(buy/pack-1e-9);qty=packs*pack}
  else{packs=1;qty=unit==='stk'?Math.ceil(buy-1e-9):Math.ceil(buy/50-1e-9)*50}
  return{buy:buy,packs:packs,qty:qty,excess:qty-buy};
}
function computeList(w){
  var needs=aggNeeds(planIds(w,false)),out=[],seen={};
  Object.keys(needs).forEach(function(key){
    var n=needs[key],p=pan(n.k),same=p&&p.unit===n.unit;
    var stock=same?curQty(p):0,min=same?reserve(p):0,pack=same?(p.pack||0):0;
    var b=buyCalc(stock,min,pack,n.need,n.unit);seen[n.k]=1;
    if(b)out.push({k:n.k,name:n.name,unit:n.unit,need:n.need,stock:stock,pack:pack,packs:b.packs,qty:b.qty,reason:stock<n.need-1e-9?'need':'low',cat:(p&&p.cat)||'Andet'});
  });
  Object.keys(S.pantry.items||{}).forEach(function(k){
    if(seen[k])return;var p=S.pantry.items[k];if(p.leftover||!isLow(p))return;
    var mode=p.rule||'under',cq=curQty(p),pack=p.pack||0,b;
    if(mode==='out'){b={packs:1,qty:pack>0?pack:(p.unit==='stk'?1:100)}}
    else{b=buyCalc(cq,reserve(p),pack,0,p.unit)}
    if(b)out.push({k:k,name:p.name,unit:p.unit,need:0,stock:cq,pack:pack,packs:b.packs,qty:b.qty,reason:mode==='out'?'out':'low',cat:p.cat||'Andet'});
  });
  return out;
}
function wasteOf(ids){
  var needs=aggNeeds(ids),pen=0,rest=[];
  Object.keys(needs).forEach(function(key){
    var n=needs[key],p=pan(n.k);if(!p||p.unit!==n.unit||!(p.pack>0))return;
    var b=buyCalc(curQty(p),reserve(p),p.pack,n.need,n.unit);if(!b)return;
    var frac=b.excess/p.pack;pen+=(p.perish?1:.25)*frac;
    if(p.perish&&frac>=.2)rest.push({name:p.name,qty:b.excess,unit:p.unit});
  });
  return{pen:pen,rest:rest};
}
function coverage(ids){
  var needs=aggNeeds(ids),lines=0,cov=0,buy=0;
  Object.keys(needs).forEach(function(key){
    var n=needs[key],p=pan(n.k),st=p&&p.unit===n.unit?curQty(p):0;
    lines++;cov+=n.need>0?Math.min(1,st/n.need):1;if(st<n.need-1e-9)buy++;
  });
  return{lines:lines,cov:cov,buy:buy};
}
function recCov(r){
  var sc=(S.settings.persons||2)/2,ing=r.ing||[];if(!ing.length)return 0;var s=0;
  ing.forEach(function(g){var p=pan(slug(g.n)),st=p&&p.unit===g.u?curQty(p):0;s+=Math.min(1,st/(g.q*sc))});
  return s/ing.length;
}

/* ---------- plan generator (stock first) ---------- */
function offerHits(r,w){var c=0;(r.ing||[]).forEach(function(g){var it={k:slug(g.n),name:g.n};if(activeOffers(w).some(function(o){return offerMatch(o,it)}))c++});return c}
function ctxFor(w){
  var t=todayStr(),exp={};
  Object.keys(S.pantry.items||{}).forEach(function(k){var p=S.pantry.items[k];if(p.expires&&curQty(p)>0&&daysBetween(t,p.expires)<=5)exp[k]=1});
  var hits={},cov={};Object.keys(S.recipes).forEach(function(id){hits[id]=offerHits(S.recipes[id],w);cov[id]=recCov(S.recipes[id])});
  return{exp:exp,hits:hits,cov:cov};
}
function fit(r,i,ctx,id){
  var s=0,wk=isWeekend(i);
  if(wk){s+=r.kind==='weekend'?3:-6}
  else{s+=r.kind==='hverdag'?3:-4;var m=r.minutes||40;s+=m<=30?2:m<=45?.5:-2}
  s+=((r.rating||3)-3)*.8;
  var mw=(r.made&&r.made.wd&&r.made.wd[i])||0;s+=Math.min(2,mw*.7);
  if(r.made&&r.made.last){var dd=daysBetween(r.made.last,addDays(S.mon,i));if(dd<10)s-=3;else if(dd<21)s-=1}
  var ex=0;(r.ing||[]).forEach(function(g){if(ctx.exp[slug(g.n)])ex++});
  s+=Math.min(3,ex*1.5)*(1.3-i/10);
  s+=Math.min(2.5,(ctx.hits[id]||0)*.6);
  var c=ctx.cov[id]||0;s+=5*c+(c>=.99?1.5:0);
  return s;
}
function generate(w){
  var ids=Object.keys(S.recipes),old=((S.plans[w]||{}).days)||[];
  var fixed=[0,1,2,3,4,5,6].map(function(i){var d=old[i];return d&&(d.r||d.f)&&(d.lock||d.done)?d:null});
  var free=[0,1,2,3,4,5,6].filter(function(i){return !fixed[i]});
  var used={};fixed.forEach(function(d){if(d&&d.r)used[d.r]=1});
  var pool=ids.filter(function(id){return !used[id]});
  if(!pool.length||!free.length)return null;
  var ctx=ctxFor(w);
  function score(arr){
    var s=0,live=[];
    arr.forEach(function(id,i){if(!id)return;s+=fit(S.recipes[id],i,ctx,id);if(!(fixed[i]&&fixed[i].done))live.push(id)});
    s-=wasteOf(live).pen*1.5;
    var cv=coverage(live);if(cv.lines){s+=10*cv.cov/cv.lines;s-=.5*cv.buy}
    for(var i=1;i<7;i++){var a=(S.recipes[arr[i-1]]||{}).prot,b=(S.recipes[arr[i]]||{}).prot;if(a&&a===b)s-=2}
    var cnt={};arr.forEach(function(id){var p=id&&S.recipes[id].prot;if(p)cnt[p]=(cnt[p]||0)+1});
    Object.keys(cnt).forEach(function(p){if(cnt[p]>2)s-=(cnt[p]-2)*4});
    if(S.settings.welfare){var meat=(cnt.okse||0)+(cnt.kylling||0)+(cnt.svin||0);if(meat>4)s-=(meat-4)*4}
    return s;
  }
  var best=null,bs=-1e9;
  for(var rs=0;rs<8;rs++){
    var sh=pool.slice().sort(function(){return Math.random()-.5});
    var cur=['','','','','','',''];fixed.forEach(function(d,i){if(d)cur[i]=d.r||''});
    free.forEach(function(i,j){cur[i]=sh[j]||''});
    var cs=score(cur);if(cs>bs){bs=cs;best=cur.slice()}
    for(var it=0;it<500;it++){
      var i=free[Math.floor(Math.random()*free.length)],nx=cur.slice();
      if(Math.random()<.5&&free.length>1){var j=free[Math.floor(Math.random()*free.length)];if(j===i)continue;var tmp=nx[i];nx[i]=nx[j];nx[j]=tmp}
      else{var cand=pool[Math.floor(Math.random()*pool.length)];if(nx.indexOf(cand)>-1)continue;nx[i]=cand}
      var ns=score(nx),T=1.2*(1-it/500);
      if(ns>=cs||Math.random()<Math.exp((ns-cs)/Math.max(T,.01))){cur=nx;cs=ns}
      if(cs>bs){bs=cs;best=cur.slice()}
    }
  }
  return best.map(function(id,i){return fixed[i]||{r:id,done:false,lock:false}});
}

/* ---------- tilbud: hvilken butik har flest af varerne ---------- */
function routeLine(items,w){
  var per={};
  items.forEach(function(it){activeOffers(w).forEach(function(o){if(offerMatch(o,it)){(per[o.store]=per[o.store]||{})[it.k+'_'+it.unit]=1}})});
  var arr=Object.keys(per).map(function(s){return{store:s,n:Object.keys(per[s]).length}}).sort(function(a,b){return b.n-a.n});
  if(!arr.length)return null;
  var first=arr[0],have=per[first.store],second=null;
  arr.slice(1).forEach(function(x){var extra=Object.keys(per[x.store]).filter(function(k){return !have[k]}).length;if(extra>=3&&(!second||extra>second.extra))second={store:x.store,extra:extra}});
  return{first:first,second:second,total:items.length};
}

/* ---------- rendering ---------- */
function render(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;draw()})}
function banner(){
  var b='';
  if(S.nodb)b+='<div class="banner warn">Appen kan ikke gemme data her. Åbn den i Claude og log ind.</div>';
  else if(S.slow&&!S.ready.pantry)b+='<div class="banner warn">Kan ikke nå databasen endnu. Data vises, når forbindelsen er tilbage.</div>';
  if(S.ro)b+='<div class="banner warn">Du kan kun se data. Bed ejeren om redigeringsadgang.</div>';
  if(S.settings.example)b+='<div class="banner"><span>Eksempeldata. Ryd, når dine egne er lagt ind.</span><button class="btn ghost sm" data-act="clearex">Ryd</button></div>';
  return b;
}
function draw(){

  $('#view').innerHTML=banner()+f();
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-current',t.dataset.tab===S.tab?'page':'false')});
}
function weekNav(){
  var w=isoWeek(S.mon),a=parseYmd(S.mon),b=parseYmd(addDays(S.mon,6));
  var rng=a.getUTCMonth()===b.getUTCMonth()?a.getUTCDate()+'.–'+b.getUTCDate()+'. '+MON[b.getUTCMonth()]:a.getUTCDate()+'. '+MON[a.getUTCMonth()]+' – '+b.getUTCDate()+'. '+MON[b.getUTCMonth()];
  var cur=mondayOf(todayStr()),tag=S.mon===cur?' · denne uge':S.mon===addDays(cur,7)?' · næste uge':'';

}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:''}
function srcHost(u){return safeUrl(u).replace(/^https?:\/\/(www\.)?/i,'').split('/')[0]}
function recMeta(r){var m=[];if(r.book)m.push(esc(r.book)+(r.page?' s. '+r.page:''));if(r.minutes)m.push(r.minutes+' min');return m.join(' · ')}
function dayName(d){if(d.f){var fp=pan(d.f);return fp?fp.name:'Rest fra fryseren'}var r=d.r&&S.recipes[d.r];return r?r.name:''}

/* --- Ugeplan --- */
function dayRow(i,d,t){
  d=d||{};var r=d.r&&S.recipes[d.r],date=addDays(S.mon,i),dd=parseYmd(date).getUTCDate();

      '<div class="da">'+(r&&safeUrl(r.url)?'<a class="ol" href="'+esc(safeUrl(r.url))+'" target="_blank" rel="noopener noreferrer" aria-label="Åbn opskriften på '+esc(srcHost(r.url))+'">'+LINK+'</a>':'')+'<button class="ck'+(d.done?' on':'')+'" data-act="done" data-i="'+i+'" aria-label="Markér som lavet" aria-pressed="'+(!!d.done)+'">'+CHECK+'</button></div>';
  }else h+='<button class="dm" data-act="pick" data-i="'+i+'"><span class="dn muted">Vælg ret</span></button><div></div>';

}
function viewWeek(){
  var w=wid(),plan=S.plans[w],days=(plan&&plan.days)||[],has=days.some(function(d){return d.r||d.f}),t=todayStr(),h=weekNav();

  }else{

  }

}

/* --- Indkøb --- */
function viewShop(){
  var w=wid(),items=computeList(w),L=S.lists[w]||{},chk=L.checked||{},extra=L.extra||[],h=weekNav();
  if(!planIds(w,false).length&&!items.length)h+='<div class="empty"><p>Listen er tom. Lav en madplan under Ugeplan, så regner appen ud, hvad du mangler.</p><button class="btn" data-act="tab" data-tab="week">Til ugeplanen</button></div>';
  var rl=routeLine(items,w),norm=0,withOffer=0,unpriced=0,hasQ=false;
  items.forEach(function(it){if(qual(it.k))hasQ=true;var c=lineCost(it);if(!(c>0)){unpriced++;return}norm+=c;var bo=bestOffer(it,w);withOffer+=(bo&&bo.cost<c)?bo.cost:c});
  if(norm>0||rl){
    h+='<div class="route"><div class="lbl">Overslag</div>'+(norm>0?'<div class="big">ca. '+kr(Math.round(norm))+'</div>':'')+
      (norm>0&&withOffer<norm-.5?'<p>Med tilbud ca. '+kr(Math.round(withOffer))+'.</p>':'')+
      (rl?'<p><b>'+esc(rl.first.store)+'</b> har '+rl.first.n+' af '+rl.total+' varer på tilbud.'+(rl.second?' '+esc(rl.second.store)+' har '+rl.second.extra+' flere.':'')+'</p>':'')+
      (hasQ?'<p class="muted sm">Kød og fisk: økologi eller Bedre Dyrevelfærd med 3 hjerter.</p>':'')+
      (norm>0?'<p class="muted sm">Ud fra normalpriser.'+(unpriced?' '+unpriced+' varer uden pris er ikke med.':'')+'</p>':'')+'</div>';
  }
  var groups={};items.forEach(function(it){(groups[it.cat]=groups[it.cat]||[]).push(it)});
  var nchk=0;
  CATS.forEach(function(c){
    if(!groups[c])return;
    h+='<div class="sec"><div class="lbl">'+esc(c)+'</div><div class="group">'+groups[c].sort(function(a,b){return a.name.localeCompare(b.name,'da')}).map(function(it){
      var key=it.k+'_'+it.unit,on=!!chk[key];if(on)nchk++;
      var bo=bestOffer(it,w),qt=it.pack>0?it.packs+' pk. · '+fq(it.qty,it.unit):fq(it.qty,it.unit);
      var ot=bo?esc(bo.o.store)+' · '+kr(bo.o.price)+(bo.o.qty&&bo.o.unit?' ('+fq(bo.o.qty,bo.o.unit)+')':''):'';
      return '<label class="it'+(on?' on':'')+'"><input type="checkbox" data-chk="'+esc(key)+'"'+(on?' checked':'')+'><span><span class="it-n">'+esc(it.name)+'</span><span class="it-m"><span class="mono">'+qt+'</span>'+(lineCost(it)>0?'<span class="mono">ca. '+kr(Math.round(lineCost(it)))+'</span>':'')+(qual(it.k)?'<span class="chip">Øko / 3 hjerter</span>':'')+'</span>'+(ot?'<span class="it-o">'+ot+'</span>':'')+'</span></label>'}).join('')+'</div></div>';
  });
  h+='<div class="sec"><div class="lbl">Ekstra</div><div class="group">'+extra.map(function(x){var on=!!chk['x_'+x.id];if(on)nchk++;
    return '<label class="it'+(on?' on':'')+'"><input type="checkbox" data-chk="x_'+esc(x.id)+'"'+(on?' checked':'')+'><span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="it-n">'+esc(x.name)+'</span><button class="x" data-act="delx" data-id="'+esc(x.id)+'" aria-label="Fjern '+esc(x.name)+'">×</button></span></label>'}).join('')+'</div>'+
    '<div class="add-row"><input id="xin" type="text" placeholder="Tilføj vare, fx slik eller brød" aria-label="Ny ekstra vare"><button class="btn" data-act="addx">Tilføj</button></div></div>';
  if(nchk)h+='<button class="btn" data-act="tostock">Læg afkrydsede på lageret</button>';
  return h;
}

/* --- Lager --- */
function stockItems(){return Object.keys(S.pantry.items||{}).map(function(k){var p=S.pantry.items[k];return Object.assign({k:k},p)})}
function grp(p){return (p.leftover||p.loc==='fryser')?'Frost':(p.cat||'Andet')}

  var q=S.q.trim().toLowerCase(),t=todayStr();
  var items=stockItems().filter(function(p){return !q||String(p.name).toLowerCase().indexOf(q)>-1}),h='';
  CATS.forEach(function(c){
    var g=items.filter(function(p){return grp(p)===c}).sort(function(a,b){return a.name.localeCompare(b.name,'da')});

      return '<button class="li" data-act="editstock" data-k="'+esc(p.k)+'"><span><span class="nm">'+esc(p.name)+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</span><span class="qt">'+pq(p,cq)+'</span></button>'}).join('')+'</div></div>';
  });
  return h||'<p class="muted">Ingen varer fundet.</p>';
}
function viewStock(){
  var items=stockItems();
  return '<div class="add-row"><input id="sq" type="text" placeholder="Søg i lageret" value="'+esc(S.q)+'" aria-label="Søg i lageret"><button class="btn" data-act="newstock">Ny vare</button></div>'+
    '<div id="stockList" style="display:flex;flex-direction:column;gap:18px">'+(items.length?stockListHtml():'<div class="empty"><p>Lageret er tomt. Tilføj det, du har hjemme. Når du markerer en ret som lavet, trækker appen forbruget fra.</p></div>')+'</div>';

var opt=function(list,sel){return list.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>'}).join('')};

/* pick a recipe (or a freezer meal) for a day */
function openPick(i){
  var w=wid(),d=((S.plans[w]||{}).days||[])[i]||{};
  var ctx=ctxFor(w),list=Object.keys(S.recipes).map(function(id){return{id:id,s:fit(S.recipes[id],i,ctx,id)}}).sort(function(a,b){return b.s-a.s});
  var frz=stockItems().filter(function(p){return p.leftover&&curQty(p)>=1});
  var h='<p class="muted sm">'+DAYS[i]+' den '+parseYmd(addDays(S.mon,i)).getUTCDate()+'.</p>';
  if(frz.length)h+='<div class="sec"><div class="lbl">Fra fryseren</div><div>'+frz.map(function(p){return '<button class="li" data-act="setfrz" data-i="'+i+'" data-k="'+esc(p.k)+'"><span><span class="nm">'+esc(p.name)+'</span></span><span class="qt">'+pq(p,curQty(p))+'</span></button>'}).join('')+'</div></div>';
  h+='<div class="sec"><div class="lbl">Retter</div><div>'+list.map(function(x){var r=S.recipes[x.id],m=recMeta(r);
    return '<button class="li" data-act="setday" data-i="'+i+'" data-id="'+x.id+'"><span><span class="nm">'+esc(r.name)+'</span>'+(m?'<span class="sub">'+m+'</span>':'')+'</span></button>'}).join('')+'</div></div>';
  if(d.r||d.f)h+='<button class="btn danger" data-act="setday" data-i="'+i+'" data-id="">Fjern fra dagen</button>';
  openSheet('Vælg ret',h);
}

/* recipes */
function openRecipes(){
  var ids=Object.keys(S.recipes),h='<button class="btn" data-act="newrec">Ny ret</button>';
  if(!ids.length)h+='<p class="muted">Ingen retter endnu. Tag et billede af en opskrift i kogebogen, så udfylder appen ingredienserne.</p>';
  var books={};ids.forEach(function(id){var r=S.recipes[id],b=r.book||'Egne retter';(books[b]=books[b]||[]).push(id)});
  Object.keys(books).sort(function(a,b){return a==='Egne retter'?1:b==='Egne retter'?-1:a.localeCompare(b,'da')}).forEach(function(b){
    h+='<div class="sec"><div class="lbl">'+esc(b)+'</div><div>'+books[b].sort(function(a,c){return (S.recipes[a].page||0)-(S.recipes[c].page||0)||S.recipes[a].name.localeCompare(S.recipes[c].name,'da')}).map(function(id){
      var r=S.recipes[id];
      return '<button class="li" data-act="editrec" data-id="'+id+'"><span><span class="nm">'+esc(r.name)+'</span><span class="sub">'+(r.page?'<span class="mono">s. '+r.page+'</span>':'')+(r.minutes?'<span>'+r.minutes+' min</span>':'')+(r.kind==='weekend'?'<span class="chip wk">Weekend</span>':'')+'</span></span></button>'}).join('')+'</div></div>';
  });
  openSheet('Mine retter',h);
}

/* purchase rule block (shared by stock sheet and recipe rows) */

    '<div class="grid2"><div class="field r-f-under"'+(r.rule==='under'?'':' hidden')+'><label>Grænse</label><input class="r-min" inputmode="decimal" value="'+esc(dec(r.min))+'"></div>'+
    '<div class="field r-f-days"'+(r.rule==='days'?'':' hidden')+'><label>Dage tilbage</label><input class="r-days" inputmode="decimal" value="'+esc(dec(r.days))+'"></div>'+
    '<div class="field r-f-use"'+(r.rule==='never'?' hidden':'')+'><label>Forbrug pr. uge (valgfri)</label><input class="r-use" inputmode="decimal" value="'+(r.use?esc(dec(r.use)):'')+'"></div>'+
    '<div class="field"><label>Pakkestørrelse</label><input class="r-pack" inputmode="decimal" value="'+(r.pack?esc(dec(r.pack)):'')+'"></div></div></div>';

function readRule(el){var g=function(c){return el.querySelector(c)};return{rule:g('.r-mode').value,min:Math.max(0,num(g('.r-min').value)),days:Math.max(0,num(g('.r-days').value)),use:Math.max(0,num(g('.r-use').value)),pack:Math.max(0,num(g('.r-pack').value))}}
function syncRule(el){var m=el.querySelector('.r-mode').value;el.querySelector('.r-f-under').hidden=m!=='under';el.querySelector('.r-f-days').hidden=m!=='days';el.querySelector('.r-f-use').hidden=m==='never'}
function refreshSummary(row){

function collectIng(){
  return Array.prototype.map.call(document.querySelectorAll('#rf-ings .ingw'),function(row){return{n:row.querySelector('.i-n').value.trim().toLowerCase(),q:num(row.querySelector('.i-q').value),u:row.querySelector('.i-u').value,rule:readRule(row.querySelector('.rule'))}}).filter(function(g){return g.n&&g.q>0});
}
function saveRecipe(id){
  var name=$('#rf-name').value.trim(),rows=collectIng();
  if(!name){toast('Giv retten et navn');return}
  if(!rows.length){toast('Tilføj mindst én ingrediens med mængde');return}
  var old=id?S.recipes[id]:null,rid=id||uid(),t=todayStr();
  var doc={name:name,book:$('#rf-book').value.trim(),page:Math.round(num($('#rf-page').value))||0,kind:$('#rf-kind').value,minutes:Math.round(num($('#rf-min').value))||0,rating:Number($('#rf-rate').value)||0,prot:$('#rf-prot').value,ing:rows.map(function(g){return{n:g.n,q:g.q,u:g.u}}),example:false,url:safeUrl($('#rf-url').value),made:(old&&old.made)||{count:0,last:'',wd:[0,0,0,0,0,0,0]}};
  save(function(){
    var patch={},items=S.pantry.items||{};
    rows.forEach(function(g){var k=slug(g.n),o=items[k],r=g.rule;
      if(!o)patch[k]=Object.assign({name:g.n,unit:g.u,qty:0,price:0,perish:false,cat:'Andet',expires:'',at:t},r);
      else patch[k]=Object.assign({},r,(r.use>0&&!o.at)?{at:t}:{});
    });
    return up(db.doc('store/pantry'),{items:patch}).then(function(){return db.doc('recipes/'+rid).set(doc)}).then(function(){openRecipes();toast('Ret gemt')});
  });
}
function readRecipe(){
  var files=$('#rf-file').files,st=$('#rf-st');
  if(!files||!files.length){st.textContent='Vælg et billede først.';return}
  if(!S.sample||!S.imgOK){st.textContent='Fotolæsning er ikke tilgængelig her. Skriv ingredienserne ind selv.';return}
  S.ctl=new AbortController();$('#rf-read').disabled=true;
  st.innerHTML='Læser billedet… <button class="btn ghost sm" data-act="stopread">Stop</button>';
  var prompt='Billederne viser en opskrift fra en kogebog, som tilhører brugeren, til privat brug. Udtræk KUN retnavn, ca. tilberedningstid i minutter, antal portioner opskriften er skrevet til og ingredienslisten. Kopiér ikke fremgangsmåden. Omregn alle mængder til g, ml eller stk (1 dl = 100 ml, 1 spsk = 15 ml, 1 tsk = 5 ml, 1 kg = 1000 g, 1 l = 1000 ml). Udelad salt, peber og vand. Skriv ingrediensnavne med små bogstaver i ubestemt form, fx "hakket oksekød" eller "løg". Svar kun med JSON: {"name":string,"minutes":number|null,"servings":number,"ingredients":[{"n":string,"q":number,"u":"g"|"ml"|"stk"}]}';
  S.sample.json(prompt,{images:files,signal:S.ctl.signal}).then(function(res){
    var f=(S.settings.persons||2)/(num(res.servings)>0?num(res.servings):(S.settings.persons||2));
    var rows=(res.ingredients||[]).filter(function(g){return g&&g.n&&num(g.q)>0}).map(function(g){var u=UNITS.indexOf(g.u)>-1?g.u:'stk',q=num(g.q)*f;q=u==='stk'?Math.round(q*2)/2:q>=20?Math.round(q/5)*5:r1(q);return{n:String(g.n).toLowerCase(),q:q||1,u:u}});
    if(!rows.length){st.textContent='Kunne ikke finde en ingrediensliste. Prøv et skarpere billede.';return}
    if(!$('#rf-name').value&&res.name)$('#rf-name').value=res.name;
    if(res.minutes)$('#rf-min').value=Math.round(num(res.minutes));
    $('#rf-ings').innerHTML=rows.map(ingRow).join('');
    st.textContent='Ingredienserne er indsat. Tjek mængderne og tryk Gem ret.';
  }).catch(function(e){
    var c=e&&e.code;st.textContent=c==='cancelled'?'Stoppet.':c==='not_granted'?'Du har ikke givet appen lov til at bruge Claude.':c==='rate_limited'?'For mange forsøg. Vent lidt og prøv igen.':c==='invalid_json'||c==='refused'||c==='image_rejected'?'Kunne ikke læse billedet. Prøv et skarpere billede.':'Noget gik galt. Prøv igen.';
  }).then(function(){S.ctl=null;var b=$('#rf-read');if(b)b.disabled=false});
}

/* ---------- actions ---------- */
function savePlanDays(w,days){return db.doc('plans/'+w).set({week:w,start:S.mon,days:days,gen:Date.now()})}
function daysOf(w){return (((S.plans[w]||{}).days)||[]).map(function(x){return Object.assign({},x)})}
var ACT={
  tab:function(d){S.tab=d.tab;draw();window.scrollTo(0,0)},
  wk:function(d){S.mon=addDays(S.mon,7*Number(d.d));draw()},
  gear:openSettings,
  close:closeSheet,
  stopread:function(){if(S.ctl)S.ctl.abort()},
  gen:function(){
    var w=wid(),days=generate(w);if(!days){toast('Der er ingen retter at vælge imellem');return}
    save(function(){
      return savePlanDays(w,days).then(function(){
        var L=S.lists[w]||{};
        if(S.settings.candy&&!L.slik)return up(db.doc('lists/'+w),{extra:(L.extra||[]).concat([{id:'slik',name:'Weekendslik'}]),slik:true});
      }).then(function(){toast('Madplan lavet ud fra dit lager')});
    });
  },
  pick:function(d){openPick(Number(d.i))},
  setday:function(d){
    var w=wid(),days=daysOf(w);while(days.length<7)days.push({r:'',done:false,lock:false});
    days[Number(d.i)]={r:d.id||'',done:false,lock:!!d.id};
    closeSheet();save(function(){return savePlanDays(w,days)});
  },
  setfrz:function(d){
    var w=wid(),days=daysOf(w);while(days.length<7)days.push({r:'',done:false,lock:false});
    days[Number(d.i)]={r:'',f:d.k,done:false,lock:true};
    closeSheet();save(function(){return savePlanDays(w,days)});
  },
  done:function(d){
    var w=wid(),days=daysOf(w),i=Number(d.i),day=days[i];if(!day||!(day.r||day.f))return;
    var sc=(S.settings.persons||2)/2,patch={},r=day.r&&S.recipes[day.r];
    save(function(){
      var ps=[];
      if(!day.done){
        var used=[];
        if(day.f){var fp=pan(day.f);if(fp){var cq=curQty(fp);used.push([day.f,Math.min(1,cq)]);patch[day.f]=qpatch(cq-1)}}
        else{
          if(!r)return;
          (r.ing||[]).forEach(function(g){var k=slug(g.n),p=pan(k);if(p&&p.unit===g.u){var cq=curQty(p),amt=Math.min(cq,g.q*sc);used.push([k,r1(amt)]);patch[k]=qpatch(cq-amt)}});
          var m=Object.assign({count:0,last:'',wd:[0,0,0,0,0,0,0]},r.made||{});m.wd=(m.wd||[0,0,0,0,0,0,0]).slice();m.wd[i]=(m.wd[i]||0)+1;m.count=(m.count||0)+1;m.last=addDays(S.mon,i);
          ps.push(db.doc('recipes/'+day.r).set(Object.assign({},r,{made:m})));
        }
        days[i]=Object.assign({},day,{done:true,used:used});
      }else{
        (day.used||[]).forEach(function(u){var p=pan(u[0]);if(p)patch[u[0]]=qpatch(curQty(p)+u[1])});
        days[i]=Object.assign({},day,{done:false,used:[]});
      }
      if(Object.keys(patch).length)ps.push(up(db.doc('store/pantry'),{items:patch}));
      return Promise.all(ps).then(function(){return savePlanDays(w,days)}).then(function(){toast(days[i].done?'Lavet. Lageret er opdateret':'Fortrudt. Lageret er rettet')});
    });
  },
  addx:function(){
    var v=($('#xin')||{}).value;v=(v||'').trim();if(!v)return;var w=wid(),L=S.lists[w]||{};
    save(function(){return up(db.doc('lists/'+w),{extra:(L.extra||[]).concat([{id:uid(),name:v}])})});
  },
  delx:function(d,el,e){e.preventDefault();var w=wid(),L=S.lists[w]||{};save(function(){return up(db.doc('lists/'+w),{extra:(L.extra||[]).filter(function(x){return x.id!==d.id})})})},
  tostock:function(){
    var w=wid(),items=computeList(w),chk=(S.lists[w]||{}).checked||{},patch={},cl={},n=0;
    items.forEach(function(it){var key=it.k+'_'+it.unit;if(!chk[key])return;var p=pan(it.k);n++;cl[key]=false;
      if(p&&p.unit===it.unit)patch[it.k]=qpatch(curQty(p)+it.qty);
      else if(!p)patch[it.k]=Object.assign({name:it.name,unit:it.unit,min:0,pack:0,price:0,perish:false,cat:'Andet',expires:'',rule:'under'},qpatch(it.qty))});
    if(!n){toast('Afkryds de varer, du har købt');return}
    save(function(){return up(db.doc('store/pantry'),{items:patch}).then(function(){return up(db.doc('lists/'+w),{checked:cl})}).then(function(){toast(n+' varer lagt på lageret')})});
  },
  newstock:function(){openStock('')},
  editstock:function(d){openStock(d.k)},
  savestock:function(d){saveStock(d.k)},
  kind:function(d){
    var rest=d.k==='rest';$('#f-vare').hidden=rest;$('#f-rest').hidden=!rest;
    Array.prototype.forEach.call(document.querySelectorAll('[data-act="kind"]'),function(b){var on=b.dataset.k===d.k;b.className=on?'on':'';b.setAttribute('aria-pressed',String(on))});
  },
  delstock:function(d){var items=Object.assign({},S.pantry.items);delete items[d.k];save(function(){return db.doc('store/pantry').set({items:items}).then(function(){closeSheet();toast('Varen er slettet')})})},
  savefrz:function(d){
    var patch={};patch[d.k]=Object.assign(qpatch(num($('#sf-qty').value)),{frozen:$('#sf-frz').value||''});
    save(function(){return up(db.doc('store/pantry'),{items:patch}).then(function(){closeSheet();toast('Gemt')})});
  },
  recs:openRecipes,
  newrec:function(){openRecipe('')},
  editrec:function(d){openRecipe(d.id)},
  saverec:function(d){saveRecipe(d.id)},
  delrec:function(d){save(function(){return db.doc('recipes/'+d.id).delete().then(function(){openRecipes();toast('Retten er slettet')})})},
  ingadd:function(){$('#rf-ings').insertAdjacentHTML('beforeend',ingRow())},
  ingdel:function(d,el){var row=el.closest('.ingw');if(row)row.remove()},
  readrec:readRecipe,
  savesettings:function(){
    var s={persons:Math.max(1,Math.round(num($('#st-p').value))||2),drive:S.settings.drive||40,friWeekend:$('#st-f').checked,candy:$('#st-c').checked,welfare:$('#st-w').checked,stores:Array.prototype.map.call(document.querySelectorAll('.st-s:checked'),function(x){return x.value}),example:!!S.settings.example};
    if(!s.stores.length)s.stores=STORES.slice();
    save(function(){return db.doc('store/settings').set(s).then(function(){closeSheet();toast('Indstillinger gemt')})});
  },
  clearex:function(){
    save(function(){
      var keep={},del=[];
      Object.keys(S.recipes).forEach(function(id){var r=S.recipes[id];if(r.example)del.push(id);else(r.ing||[]).forEach(function(g){keep[slug(g.n)]=1})});
      var items=Object.assign({},S.pantry.items);Object.keys(items).forEach(function(k){if(!items[k].ex)return;if(keep[k])items[k]=Object.assign({},items[k],{qty:0,at:todayStr(),ex:false});else delete items[k]});
      return Promise.all(del.map(function(id){return db.doc('recipes/'+id).delete()})).then(function(){return db.doc('store/pantry').set({items:items})}).then(function(){return up(db.doc('store/settings'),{example:false})}).then(function(){toast('Eksempeldata er ryddet')});
    });
  }
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=ACT[el.dataset.act];if(f)f(el.dataset,el,e)});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.matches)return;
  if(t.matches('[data-chk]')){
    var w=wid(),key=t.dataset.chk,v=t.checked,L=S.lists[w]||{},c=Object.assign({},L.checked||{});c[key]=v;
    S.lists[w]=Object.assign({},L,{checked:c});draw();
    var p={};p[key]=v;save(function(){return up(db.doc('lists/'+w),{checked:p})});
  }else if(t.matches('.r-mode')){syncRule(t.closest('.rule'));refreshSummary(t.closest('.ingw'))}
  else if(t.matches('.i-u')){refreshSummary(t.closest('.ingw'))}
  else if(t.matches('.i-n')){
    var row=t.closest('.ingw'),p2=pan(slug(t.value));
    if(row&&p2){row.querySelector('.i-u').value=p2.unit;row.querySelector('.rl').innerHTML='<summary>'+esc(ruleSummary(ruleOf(p2),p2.unit))+'</summary>'+ruleHtml(p2)}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='sq'){S.q=t.value;var l=$('#stockList');if(l)l.innerHTML=stockListHtml()}
  else if(t.matches&&t.matches('.r-min,.r-days,.r-use,.r-pack')){refreshSummary(t.closest('.ingw'))}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#sheet').firstChild)closeSheet();
  if(e.key==='Enter'&&e.target.id==='xin'){e.preventDefault();ACT.addx()}
});

/* ---------- data ---------- */
function ready(k){S.ready[k]=1;render()}
function fromCol(snap,key){var o={};snap.docs.forEach(function(d){o[d.id]=d.data()});S[key]=o;ready(key)}
function sub(q,fn){q.onSnapshot(fn,function(e){console.error(e);if(e&&e.code==='revoked'){S.ro=true}render()})}
function boot(){
  draw();
  setTimeout(function(){if(!S.ready.pantry){S.slow=true;render()}},10000);
  var c=window.claude;
  if(!c||!c.use){S.nodb=true;draw();return}
  c.use('db').then(function(d){
    db=d;if(!db){S.nodb=true;draw();return}
    sub(db.doc('store/pantry'),function(s){var d=s.exists?s.data():{};S.pantry=Object.assign({items:{}},d);if(!S.pantry.items)S.pantry.items={};ready('pantry')});
    sub(db.doc('store/settings'),function(s){S.settings=Object.assign({},DEF,s.exists?s.data():{});if(!S.settings.stores||!S.settings.stores.length)S.settings.stores=STORES.slice();ready('settings')});
    sub(db.collection('recipes'),function(s){fromCol(s,'recipes')});
    sub(db.collection('plans'),function(s){fromCol(s,'plans')});
    sub(db.collection('offers'),function(s){fromCol(s,'offers')});
    sub(db.collection('lists'),function(s){fromCol(s,'lists')});
  }).catch(function(){S.nodb=true;draw()});
  c.use('user').then(function(u){if(u&&u.can&&u.can('data.write')===false){S.ro=true;render()}}).catch(function(){});
  c.use('sample').then(function(sm){
    S.sample=sm;if(sm&&sm.limits)return sm.limits().then(function(l){S.imgOK=!!(l&&l.images)}).catch(function(){})
  }).catch(function(){});
}
if(window.__TEST__){window.__TEST__.api={S:S,generate:generate,computeList:computeList,wasteOf:wasteOf,coverage:coverage,routeLine:routeLine,curQty:curQty,isLow:isLow,weekId:weekId,draw:draw,ruleSummary:ruleSummary,recCov:recCov,buyCalc:buyCalc,ACT:ACT,openStock:openStock,openRecipe:openRecipe,openRecipes:openRecipes,openPick:openPick,ruleHtml:ruleHtml,ingRow:ingRow,bestOffer:bestOffer,lineCost:lineCost,qual:qual,ppu:ppu,setDb:function(x){db=x}}}
else boot();
})();

</script>
